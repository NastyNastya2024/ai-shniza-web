<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — {AI}-шница</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/brand/png/apple-touch-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css?v=2">
</head>
<body class="studio">
  <div class="page-shell">
    <a href="/">← В чат</a>
    <h1>Админка</h1>
    <div class="admin-cards" data-cards></div>
    <h2 style="font-family:var(--display);font-size:1.1rem">Жалобы</h2>
    <div data-complaints></div>
    <h2 style="font-family:var(--display);font-size:1.1rem;margin-top:24px">Отчёт по моделям</h2>
    <table class="ledger-table">
      <thead><tr><th>Модель</th><th>Выручка</th><th>Себест.</th><th>Маржа</th><th>Джобов</th></tr></thead>
      <tbody data-report></tbody>
    </table>
  </div>
  <script>
    async function csrf(){const m=document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);if(m)return decodeURIComponent(m[1]);const r=await fetch('/api/csrf',{credentials:'same-origin'});return (await r.json()).csrf_token||'';}
    async function api(path,opts={}){const method=(opts.method||'GET').toUpperCase();const headers={'Content-Type':'application/json',...(opts.headers||{})};if(method!=='GET')headers['X-CSRF-Token']=await csrf();const res=await fetch(path,{credentials:'same-origin',...opts,headers});return {res,data:await res.json().catch(()=>({}))};}
    (async()=>{
      const ov=await api('/api/admin/overview');
      if(!ov.res.ok){document.querySelector('[data-cards]').textContent='Нет доступа (ADMIN_EMAILS)';return;}
      const d=ov.data;
      document.querySelector('[data-cards]').innerHTML=`
        <div class="admin-card">Курс USD/RUB<strong>${d.usd_rub_rate}${d.rate_stale?' (stale +10%)':''}</strong></div>
        <div class="admin-card">Free queue<strong>${d.free_queue_len} / ${d.free_capacity_24h}</strong></div>
        <div class="admin-card">Пауза до<strong>${d.free_paused_until?new Date(d.free_paused_until*1000).toLocaleString('ru-RU'):'—'}</strong></div>
        <div class="admin-card">Жалобы<strong>${d.open_complaints}</strong></div>
        <div class="admin-card">Ассистент без LLM<strong>${(d.assistant_metrics||[]).map(m=>m.day+': '+(m.without_llm||0)+'/'+(m.total||0)).join(' · ')||'—'}</strong></div>`;
      const c=await api('/api/admin/complaints');
      const root=document.querySelector('[data-complaints]');
      (c.data.items||[]).forEach(item=>{
        const el=document.createElement('div');
        el.className='admin-card';
        el.style.marginBottom='8px';
        el.innerHTML=`#${item.id} work ${item.work_id}: ${item.reason}
          <div class="quick-amounts" style="margin-top:8px">
            <button type="button" data-hide>Скрыть</button>
            <button type="button" data-restore>Вернуть</button>
          </div>`;
        el.querySelector('[data-hide]').onclick=async()=>{await api('/api/admin/complaints/'+item.id+'/hide',{method:'POST',body:'{}'});el.remove();};
        el.querySelector('[data-restore]').onclick=async()=>{await api('/api/admin/complaints/'+item.id+'/restore',{method:'POST',body:'{}'});el.remove();};
        root.appendChild(el);
      });
      if(!(c.data.items||[]).length) root.textContent='Открытых жалоб нет';
      const rep=await api('/api/admin/report');
      const tb=document.querySelector('[data-report]');
      (rep.data.items||[]).forEach(row=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${row.model_key||'—'}</td><td>${(row.revenue_kop/100).toFixed(2)} ₽</td><td>${row.est_cost_rub} ₽</td><td class="${row.low_margin?'low-margin':''}">${Math.round(row.margin*100)}%</td><td>${row.jobs}</td>`;
        tb.appendChild(tr);
      });
    })();
  </script>
</body>
</html>
