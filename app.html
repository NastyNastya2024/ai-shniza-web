<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{AI}-шница — Студия</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/brand/png/apple-touch-icon-180.png">

<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.brand-logo{height:28px;width:auto;display:block}
.brand-logo-sm{height:24px}
.brand-mark{height:36px;width:36px;display:block}
.t-dark .brand-logo-light,.t-dark .brand-mark-light{display:none}
.t-light .brand-logo-dark,.t-light .brand-mark-dark{display:none}

body{margin:0;background:#EEEAF8}
.t-light{--bg:#EEEAF8;--ink:#1E1238;--muted:#5B4D93;--muted2:#6E62A3;--glass:rgba(255,255,255,.66);--glass-brd:rgba(255,255,255,.95);--soft:rgba(255,255,255,.6);--soft-hover:rgba(255,255,255,.95);--field:rgba(244,241,252,.85);--field-brd:rgba(80,60,160,.12);--nav-on:rgba(255,255,255,.95);--seg-bg:rgba(60,40,130,.07);--seg-on:#FFFFFF;--card:rgba(255,255,255,.6);--card-on:#FFFFFF;--accent-ink:#4B2BB8;--shadow:rgba(75,43,184,.28);--free:#B5470C;--caret:#E8691C;--bubble-tail:rgba(255,255,255,.66);--panel-surface:#F7F5FC;--panel-brd:rgba(80,60,160,.10)}
.t-dark{--bg:#15122A;--ink:#F6F3FF;--muted:#C9C0EE;--muted2:#A79DD6;--glass:rgba(46,38,78,.86);--glass-brd:rgba(255,255,255,.15);--soft:rgba(255,255,255,.08);--soft-hover:rgba(255,255,255,.15);--field:rgba(255,255,255,.09);--field-brd:rgba(255,255,255,.2);--nav-on:rgba(255,255,255,.16);--seg-bg:rgba(10,6,24,.32);--seg-on:rgba(255,255,255,.2);--card:rgba(255,255,255,.075);--card-on:rgba(255,255,255,.16);--accent-ink:#D4C8FF;--shadow:rgba(0,0,0,.6);--free:#FFB06B;--caret:#FF9A3D;--bubble-tail:#2E264E;--panel-surface:rgba(46,38,78,.92);--panel-brd:rgba(255,255,255,.15)}
.bg-light{background-image:url(assets/bg-light.jpg)}
.bg-dark{background-image:url(assets/bg-dark.jpg)}
.page-bg{background-size:cover;background-position:center;background-attachment:fixed;background-color:var(--bg);color:var(--ink)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.orb-float{animation:orbFloat 4.5s ease-in-out infinite}
.eye-shape{display:block;width:100%;height:100%;border-radius:999px;background:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.6);transition:transform .09s ease-in}
.eye-blink .eye-shape{transform:scaleY(.08)}
.caret{display:inline-block;width:.09em;height:.9em;margin-left:.06em;vertical-align:-.08em;background:var(--caret);border-radius:2px;animation:caret 1s steps(1) infinite}
.glass{background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
/* боковая панель моделей — плотная поверхность, без «замьюченного» стекла */
#left.panel{
  background:var(--panel-surface);
  border:1px solid var(--panel-brd);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:0 18px 40px -28px var(--shadow);
}
.t-light #left.panel{background:#F7F5FC}
.t-light #left.panel .model{background:rgba(255,255,255,.92)}
.t-light #left.panel .model-on{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(110deg,#FFA235 0%,#FF7B2C 45%,#FF8F7E 78%,#F6AACF 100%) border-box}
.t-light #left.panel .model-toolbar #tabs,
.t-light #left.panel .model-toolbar:not(.search-on) .search-wrap .search,
.t-light #left.panel .model-toolbar.search-on .search-wrap .search{background:rgba(60,40,130,.06)}
.t-dark #left.panel{
  background:rgba(46,38,78,.92);
  border-color:rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 60px -30px rgba(0,0,0,.85);
}
.t-dark #left.panel .model{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.08)}
.t-dark #left.panel .model:hover{border-color:rgba(255,255,255,.2)}
.t-dark #left.panel .model-on{background:linear-gradient(rgba(46,38,78,.98),rgba(46,38,78,.98)) padding-box,linear-gradient(110deg,#FFA235 0%,#FF7B2C 45%,#FF8F7E 78%,#F6AACF 100%) border-box;box-shadow:0 0 0 1px rgba(255,162,53,.18),0 8px 18px -14px rgba(240,110,130,.55)}
.t-dark .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 60px -30px rgba(0,0,0,.85)}
.t-dark .composer.glass{background:rgba(46,38,78,.9)}
.t-dark .icon-btn:not(.icon-ghost){background:rgba(46,38,78,.86);border-color:rgba(255,255,255,.16);color:var(--ink)}
.t-dark .cabinet{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
.t-dark .field{color:var(--ink)}
.t-dark #speech{color:#fff}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.nav-item:hover{background:var(--soft);color:var(--ink)}
.nav-active{background:var(--nav-on);color:var(--ink);font-weight:600;box-shadow:0 6px 18px -10px var(--shadow)}
.seg{border:none;cursor:pointer;font-family:'Onest',sans-serif;background:transparent;color:var(--muted)}
.seg:hover{color:var(--ink)}
.seg-on{background:var(--seg-on)!important;color:var(--ink)!important;box-shadow:0 4px 12px -6px var(--shadow)}
.model{width:100%;text-align:left;cursor:pointer;font-family:'Onest',sans-serif;border:1.5px solid transparent;background:var(--card);transition:background .15s ease,box-shadow .15s ease,border-color .15s ease}
.model:hover{background:var(--soft-hover)}
.model-on{
  border-color:transparent;
  background:
    linear-gradient(var(--card-on), var(--card-on)) padding-box,
    linear-gradient(110deg, #FFA235 0%, #FF7B2C 45%, #FF8F7E 78%, #F6AACF 100%) border-box;
  box-shadow:0 0 0 1px rgba(255,162,53,.12), 0 8px 18px -14px rgba(240,110,130,.55);
}
.field{border:1px solid var(--field-brd);background:var(--field);color:var(--accent-ink)}
.prompt-input{color:var(--ink)}
.prompt-input::placeholder,.search::placeholder{color:var(--muted2)}
.prompt-input:focus{outline:none}
.composer:focus-within{box-shadow:0 0 0 4px rgba(124,77,255,.18),0 24px 60px -24px var(--shadow)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8A63FF;outline-offset:2px}
.search{border:1px solid var(--field-brd);background:var(--field);color:var(--ink)}
.search:focus{outline:none;border-color:rgba(138,99,255,.55)}
.model-toolbar{display:flex;align-items:center;gap:6px;min-height:40px;position:relative}
.model-toolbar .search-wrap{position:relative;flex:0 0 40px;min-width:40px;transition:flex-basis .28s cubic-bezier(.4,.1,.2,1),flex-grow .28s cubic-bezier(.4,.1,.2,1),min-width .28s ease;z-index:2}
.model-toolbar.search-on .search-wrap{flex:1 1 auto;min-width:0}
.model-toolbar .search-wrap .search{width:100%;box-sizing:border-box;height:40px;padding:0 10px 0 36px;border-radius:12px;font-family:'Onest',sans-serif;font-size:14px;transition:padding .2s ease}
.model-toolbar:not(.search-on) .search-wrap .search{padding:0;border-color:transparent;background:var(--seg-bg);color:transparent;caret-color:transparent;cursor:pointer}
.model-toolbar:not(.search-on) .search-wrap .search::placeholder{color:transparent}
.model-toolbar:not(.search-on) .search-wrap .search::-webkit-search-cancel-button{display:none}
.model-toolbar.search-on .search-wrap .search{background:var(--seg-bg);border-color:transparent}
.model-toolbar .search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--accent-ink);pointer-events:none;z-index:1}
.model-toolbar #tabs{flex:1 1 auto;min-width:0;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--seg-bg);overflow:hidden;transition:opacity .2s ease,flex-basis .28s ease,max-width .28s ease,padding .2s ease}
.model-toolbar.search-on #tabs{flex:0 0 0;max-width:0;opacity:0;padding-left:0;padding-right:0;pointer-events:none}
.model{border-radius:14px!important;padding:9px 11px!important;gap:8px!important}
.model .m-name{font-size:13px!important;font-weight:700}
.model .m-kind{font-size:11px!important}
.model .m-price{font-size:13px!important;font-weight:700}
.model .m-unit{font-size:10px!important}
.ttl{scrollbar-width:thin}
.ttl{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);padding-bottom:18px!important}
.cabinet{border-radius:18px;background:var(--card-on);border:1px solid var(--glass-brd);box-shadow:0 -14px 30px -18px var(--shadow),0 10px 24px -18px var(--shadow);overflow:hidden;flex:0 0 auto}
.cab-row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:56px;box-sizing:border-box}
.cab-link{text-decoration:none;color:var(--ink)}
.cab-link:hover{background:var(--soft)}
.cab-tile{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cab-end{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted2)}


.t-light{--user-bg:#1E1238;--user-ink:#FFFFFF;--purple:#5B35E0;--purple2:#7A55FF;--purple-soft:rgba(91,53,224,.1);--purple-soft-h:rgba(91,53,224,.17);--purple-brd:rgba(91,53,224,.18);--purple-ink:#4A2CC0}
.t-dark{--user-bg:#EDE8FF;--user-ink:#1E1238;--purple:#7A55FF;--purple2:#9B7BFF;--purple-soft:rgba(155,123,255,.14);--purple-soft-h:rgba(155,123,255,.22);--purple-brd:rgba(155,123,255,.25);--purple-ink:#D2C4FF}
.btn-purple{border:1px solid var(--purple-brd);background:var(--purple-soft);color:var(--purple-ink);font-family:'Onest',sans-serif;font-weight:700;cursor:pointer}
.btn-purple:hover{background:var(--purple-soft-h)}
.btn-login{border:none;background:#6758A0;color:#FFFFFF;font-family:'Onest',sans-serif;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -12px rgba(103,88,160,.7)}
.btn-login:hover{background:#5C4E93}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(14px);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{color:var(--ink)}
.icon-on{color:var(--ink);background:var(--nav-on)}
.icon-ghost{width:36px;height:36px;border-radius:10px;border:none;background:transparent;backdrop-filter:none;color:var(--muted)}
.icon-ghost:hover{background:var(--soft)}
.icon-btn.lang{font-family:'Onest',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em}
.eye-p{position:absolute;width:8.5%;height:27%;top:34.5%;transition:transform .28s cubic-bezier(.3,.7,.4,1)}
.eye-p.l{left:34.25%}.eye-p.r{left:57.25%}
.hero{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 24px;text-align:center;overflow:hidden;transition:flex-grow .55s cubic-bezier(.4,.1,.2,1),opacity .4s ease,transform .55s cubic-bezier(.4,.1,.2,1),padding .55s ease,max-height .55s ease;max-height:900px}
.hero-off{flex-grow:0;opacity:0;transform:scale(.22) translateY(-60%);padding:0;max-height:0;pointer-events:none}
@keyframes avLand{0%{transform:translate(160px,-220px) scale(3.6);opacity:.2}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes msgIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.av-land{animation:avLand .7s cubic-bezier(.3,.7,.3,1) both}
.msg-in{animation:msgIn .35s ease-out both}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dots 1.1s ease-in-out infinite}
.panel{transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){.orb-float,.caret,.av-land,.msg-in,.dot,.modal-ov,.modal-card,.modal-egg,.shake,#vit,#left,.vit-btn.pulse{animation:none!important}.hero{transition:none}}

.hidden{display:none!important}
.modal-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--ov);backdrop-filter:blur(8px);animation:ovIn .25s ease-out both}
.t-light{--ov:rgba(40,24,90,.22)}.t-dark{--ov:rgba(4,2,12,.6)}
@keyframes ovIn{0%{opacity:0}100%{opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes eggPop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}70%{transform:translate(-50%,-4px) scale(1.06);opacity:1}100%{transform:translate(-50%,0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modal-card{position:relative;width:100%;max-width:420px;box-sizing:border-box;border-radius:28px;padding:56px 28px 24px;background:var(--modal-bg);border:1px solid var(--glass-brd);backdrop-filter:blur(24px);box-shadow:0 40px 90px -30px var(--shadow);animation:cardIn .35s cubic-bezier(.3,.7,.3,1) both}
.t-light{--modal-bg:rgba(255,255,255,.86)}.t-dark{--modal-bg:rgba(28,22,46,.9)}
.modal-egg{position:absolute;left:50%;top:-40px;width:80px;height:80px;transform:translateX(-50%);animation:eggPop .55s .1s cubic-bezier(.3,.7,.3,1) both}
.fld{display:flex;flex-direction:column;gap:6px}
.fld-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld-in{height:50px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--field);padding:0 16px;font-family:'Onest',sans-serif;font-size:16px;color:var(--ink);box-sizing:border-box;width:100%;transition:border-color .15s ease,box-shadow .15s ease}
.fld-in::placeholder{color:var(--muted2)}
.fld-in:focus{outline:none;border-color:var(--purple2);box-shadow:0 0 0 4px rgba(122,85,255,.16)}
.fld-err .fld-in{border-color:#E0457B}
.btn-primary{height:50px;border-radius:14px;border:none;width:100%;background:linear-gradient(135deg,var(--purple2),var(--purple));color:#FFFFFF;font-family:'Onest',sans-serif;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 26px -14px rgba(91,53,224,.85)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.link-btn{border:none;background:none;padding:0;font-family:'Onest',sans-serif;font-size:14px;font-weight:600;color:var(--accent-ink);cursor:pointer;min-height:32px}
.link-btn:hover{text-decoration:underline}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--purple);flex:0 0 auto;cursor:pointer}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp-cell{height:56px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--field);display:flex;align-items:center;justify-content:center;font-family:'Days One',sans-serif;font-size:22px;color:var(--ink)}
.otp-on{border-color:var(--purple2);box-shadow:0 0 0 4px rgba(122,85,255,.16)}
.otp-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;font-size:16px;cursor:text}
.shake{animation:shake .3s ease}
.x-btn{position:absolute;right:14px;top:14px;z-index:2}
.otp-err{border-color:#E0457B}
.otp-lock{opacity:.45}
.err-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(224,69,123,.1);border:1px solid rgba(224,69,123,.28);color:#C2305F;font-size:13px;line-height:1.45}
.t-dark .err-banner{color:#FF8DB3;background:rgba(255,120,170,.1);border-color:rgba(255,120,170,.3)}
.t-dark #errE,.t-dark #errC{color:#FF8DB3!important}
.soc{display:flex;flex-direction:column;gap:8px}
.soc-btn{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--card-on);color:var(--ink);font-family:'Onest',sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.soc-btn:hover{border-color:var(--purple2);transform:translateY(-1px)}
.soc-btn[disabled]{opacity:.55;cursor:progress;transform:none}
.or{height:1px;background:var(--field-brd);border:none;margin:2px 0}
.chk-err{color:#D63B6F}
.soc-logo{width:20px;height:20px;display:block}
.soc-fb{display:none}
.soc-btn:not(:has(.soc-logo)) .soc-fb{display:flex}
.modal-egg .eye-p{width:8.5%;height:27%;top:34.5%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- адаптив панелей (studio-responsive-guide) ---- */
#scrim{position:fixed;inset:0;z-index:44;background:rgba(20,12,45,.35);backdrop-filter:blur(3px);animation:ovIn .2s ease both}
.t-dark #scrim{background:rgba(0,0,0,.55)}
#vit{flex:0 0 380px;max-width:380px;box-sizing:border-box;border-radius:28px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);height:calc(100vh - 32px);overflow:hidden;box-shadow:0 20px 50px -30px var(--shadow);animation:vitIn .35s cubic-bezier(.3,.7,.3,1);touch-action:pan-y}
@keyframes vitIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vit-btn{position:relative;width:auto;padding:0 14px 0 12px;gap:8px;font-family:'Onest',sans-serif;font-size:14px;font-weight:600;color:var(--ink)}
.vit-btn[aria-pressed=true]{background:var(--seg-on);color:var(--accent-ink);box-shadow:0 8px 20px -12px var(--shadow)}
.vit-btn .cnt{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--purple);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.vit-h{display:flex;align-items:center;gap:6px;padding-left:2px}
.vit-h .vit-title{margin:0;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 12px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--seg-on);color:var(--accent-ink);font-family:'Onest',sans-serif;font-size:14px;font-weight:600;box-shadow:0 8px 20px -12px var(--shadow);box-sizing:border-box;width:max-content;max-width:100%}
.vit-h .vit-title svg{flex:0 0 auto}
.vit-h .vit-full{flex:1 1 auto;min-width:0;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vit-h #vitClose{flex:0 0 auto;margin-left:0}
.vit-ctx{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.vit-ctx span{max-width:100%;height:28px;padding:0 10px;border-radius:999px;background:var(--seg-bg);font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vit-ctx b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.vit-body{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px 4px;-webkit-overflow-scrolling:touch}
.vit-sec{margin-top:6px}
.vit-sec h3{margin:8px 4px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.vit-grid{columns:2;column-gap:8px}
.vit-card{break-inside:avoid;display:block;width:100%;margin:0 0 8px;padding:0;border:none;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:var(--field);text-align:left}
.vit-card img{display:block;width:100%;height:auto;transition:transform .4s ease}
.vit-card:hover img{transform:scale(1.04)}

async function ensureCsrf() {
  if (window.__csrfToken) return window.__csrfToken;
  const m = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
  if (m) { window.__csrfToken = decodeURIComponent(m[1]); return window.__csrfToken; }
  const res = await fetch('/api/csrf', { credentials: 'same-origin' });
  const data = await res.json().catch(() => ({}));
  window.__csrfToken = data.csrf_token || '';
  return window.__csrfToken;
}
async function api(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = await ensureCsrf();
  const res = await fetch(path, { credentials: 'same-origin', ...options, headers });
  let data = {};
  try { data = await res.json(); } catch (_) {}

}

      { slug: 'seedream-5-pro', model_key: 'fal/seedream-5-pro', name: 'Seedream 5 Pro', kindKey: 'studio.kind.image', type: 'image', cost: 16, rub: 16 },

document.addEventListener('click', async (e) => {
  const likeBtn = e.target.closest('[data-like-work]');
  if (likeBtn) {
    e.preventDefault();
    const id = likeBtn.getAttribute('data-like-work');
    if (!id) return;
    likeBtn.disabled = true;
    try {
      const { res, data } = await api('/api/works/' + id + '/like', { method: 'POST', body: '{}' });
      if (!res.ok) {
        if (data.error === 'not_found') alert(tr('studio.like.notFound'));
        else alert(data.error === 'rate_limited' ? tr('studio.like.rateLimited') : tr('studio.like.failed'));
        return;
      }
      const on = !!data.liked;
      likeBtn.classList.toggle('is-on', on);
      likeBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      likeBtn.style.borderColor = on ? '#E0457B' : '';
      likeBtn.style.background = on ? 'rgba(224,69,123,.12)' : '';
      likeBtn.style.color = on ? '#E0457B' : '';
      const n = likeBtn.querySelector('[data-like-n]');
      if (n) n.textContent = String(data.likes || 0);
      const msg = (app.state.msgs || []).find((m) => String(m.workId) === String(id));
      if (msg) { msg.liked = on; msg.likes = data.likes || 0; }
    } finally { likeBtn.disabled = false; }
    return;
  }
  const t = e.target.closest('[data-home],[data-login],[data-logout],[data-toggle-left],[data-toggle-right],[data-toggle-right-open],[data-works],[data-cabinet]');
  if (!t) return;
  if (t.hasAttribute('data-home')) app.goHome(e);
  else if (t.hasAttribute('data-login')) app.login();
  else if (t.hasAttribute('data-logout')) app.logout();
  else if (t.hasAttribute('data-toggle-left')) app.toggleLeft();
  else if (t.hasAttribute('data-toggle-right')) app.toggleRight();
  else if (t.hasAttribute('data-toggle-right-open')) app.openPanel();
  else if (t.hasAttribute('data-works')) { e.preventDefault(); app.showWorks(); }
  else if (t.hasAttribute('data-cabinet')) {
    if (!app.state.authed) { e.preventDefault(); app.login(); }
  }
});

async function refreshUser() {

  const user = data.user || null;
  const bal = data.available_kop != null ? data.available_kop : (data.balance_kop != null ? data.balance_kop : 0);

      userLetter: String(name).slice(0, 1).toUpperCase(),

    });

async function syncPricing() {
  try {
    const { data } = await api('/api/pricing');
    const byKey = {};
    (data.items || []).forEach((it) => { byKey[it.model_key] = it; });
    app.MODELS = app.MODELS.map((m) => {
      const it = byKey[m.model_key];
      if (!it) return m;
      const rub = Number(it.price_rub) || 0;
      if (it.is_free || rub === 0) return app.priceModel(Object.assign({}, m, { cost: 0, rub: 0, perSec: false }));
      if (it.unit === 'per_second') {
        const five = Number(it.example_rub_5s) || rub * 5;
        return app.priceModel(Object.assign({}, m, { cost: five, rub: rub, perSec: true }));
      }
      return app.priceModel(Object.assign({}, m, { cost: rub, rub: rub, perSec: false }));
    });
    lastModelsKey = '';
    scheduleRender();
  } catch (_) {}
}

    preview = null;
    pvMode = 'view';
    $('vit').classList.toggle('hidden', !v);
    $('vitBtn').classList.toggle('hidden', !!v);
    $('vitBtn').setAttribute('aria-pressed', v ? 'true' : 'false');
    lastKey = '';
    syncScrim();
    draw();
    try {
      if (v) $('vitClose').focus({ preventScroll: true });
      else $('vitBtn').focus({ preventScroll: true });
    } catch (e) {}
  }
  window.renderVit = function () {
    const key = topicText() + '|' + app.state.sel + '|' + open + '|' + app.state.chat;
    if (key === lastKey) return; lastKey = key;
    clearTimeout(timer); timer = setTimeout(draw, 250);
  };
  window.vitIsOpen = () => open;
  window.vitClose = () => setOpen(false);
  window.vitMarkLeftRestore = (v) => { leftWasOpen = !!v; };
  $('vitBtn').addEventListener('click', () => setOpen(!open));
  $('vitClose').addEventListener('click', () => setOpen(false));
  $('vitHintBtn').addEventListener('click', () => setOpen(true));
  $('vitHintX').addEventListener('click', () => { hintOff = true; draw(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open && !app.state.modal) setOpen(false); });

  function swipe(el, dir, close) {
    let x0 = null, y0 = 0, dx = 0;
    el.addEventListener('touchstart', (e) => { if (!SHEET()) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      if (x0 == null) return;
      dx = e.touches[0].clientX - x0;
      if (Math.abs(e.touches[0].clientY - y0) > Math.abs(dx)) { x0 = null; el.style.transform = ''; return; }
      if (dx * dir > 0) el.style.transform = 'translateX(' + dx + 'px)';
    }, { passive: true });
    el.addEventListener('touchend', () => { if (x0 == null) return; el.style.transform = ''; if (dx * dir > 80) close(); x0 = null; });
  }
  swipe($('vit'), 1, () => setOpen(false));
  swipe($('left'), -1, () => { if (MOBILE() && app.state.leftOpen) app.setState({ leftOpen: false }); });

  let pushed = false;
  const sheetOpen = () => SHEET() && (open || (app.state.leftOpen && MOBILE()));
  setInterval(() => {
    const o = sheetOpen();
    if (o && !pushed) { try { history.pushState({ sheet: 1 }, ''); } catch (e) {} pushed = true; }
    else if (!o && pushed) { pushed = false; try { if (history.state && history.state.sheet) history.back(); } catch (e) {} }
  }, 250);
  addEventListener('popstate', () => {
    if (!pushed) return;
    pushed = false;
    if (open) setOpen(false);
    else if (MOBILE() && app.state.leftOpen) app.setState({ leftOpen: false });
  });

  if (window.visualViewport) {
    const fit = () => document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - visualViewport.height - visualViewport.offsetTop) + 'px');
    visualViewport.addEventListener('resize', fit);
    visualViewport.addEventListener('scroll', fit);
    fit();
  }
  $('vitBody').addEventListener('click', (e) => {
    const c = e.target.closest('[data-w]'); if (c) { preview = c.dataset.w; pvMode = 'view'; drawPreview(preview); $('vitBody').scrollTop = 0; return; }
    const go = e.target.closest('[data-go]'); if (go) { preview = go.dataset.go; pvMode = 'view'; drawPreview(preview); $('vitBody').scrollTop = 0; return; }
    if (e.target.closest('[data-vback]')) { preview = null; pvMode = 'view'; draw(); return; }
    if (e.target.closest('[data-vreq]')) { pvMode = 'request'; if (preview) drawPreview(preview); $('vitBody').scrollTop = $('vitBody').scrollHeight; return; }
    if (e.target.closest('[data-vact="back"]')) { pvMode = 'view'; if (preview) drawPreview(preview); return; }
    const u = e.target.closest('[data-vuse]'); if (u) { const m = app.MODELS.find((x) => x.slug === u.dataset.vuse); if (m) { app.setState({ sel: m.slug }); app.speak(tr('studio.eggy.sameModel', { model: m.name })); } return; }
  });
  draw();
})();

</script>
</body>
</html>
