<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{AI}-шница — Студия</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/brand/png/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.brand-logo{height:28px;width:auto;display:block}
.brand-logo-sm{height:24px}
.brand-mark{height:36px;width:36px;display:block}
.t-dark .brand-logo-light,.t-dark .brand-mark-light{display:none}
.t-light .brand-logo-dark,.t-light .brand-mark-dark{display:none}

body{margin:0;background:#EEEAF8}
.t-light{--bg:#EEEAF8;--ink:#1E1238;--muted:#5B4D93;--muted2:#6E62A3;--glass:rgba(255,255,255,.66);--glass-brd:rgba(255,255,255,.95);--soft:rgba(255,255,255,.6);--soft-hover:rgba(255,255,255,.95);--field:rgba(244,241,252,.85);--field-brd:rgba(80,60,160,.12);--nav-on:rgba(255,255,255,.95);--seg-bg:rgba(60,40,130,.07);--seg-on:#FFFFFF;--card:rgba(255,255,255,.6);--card-on:#FFFFFF;--accent-ink:#4B2BB8;--shadow:rgba(75,43,184,.28);--free:#B5470C;--caret:#E8691C;--bubble-tail:rgba(255,255,255,.66);--panel-surface:#F7F5FC;--panel-brd:rgba(80,60,160,.10)}
.t-dark{--bg:#15122A;--ink:#F6F3FF;--muted:#C9C0EE;--muted2:#A79DD6;--glass:rgba(46,38,78,.86);--glass-brd:rgba(255,255,255,.15);--soft:rgba(255,255,255,.08);--soft-hover:rgba(255,255,255,.15);--field:rgba(255,255,255,.09);--field-brd:rgba(255,255,255,.2);--nav-on:rgba(255,255,255,.16);--seg-bg:rgba(10,6,24,.32);--seg-on:rgba(255,255,255,.2);--card:rgba(255,255,255,.075);--card-on:rgba(255,255,255,.16);--accent-ink:#D4C8FF;--shadow:rgba(0,0,0,.6);--free:#FFB06B;--caret:#FF9A3D;--bubble-tail:#2E264E;--panel-surface:rgba(46,38,78,.92);--panel-brd:rgba(255,255,255,.15)}
.bg-light{background-image:url(assets/bg-light.jpg)}
.bg-dark{background-image:url(assets/bg-dark.jpg)}
.page-bg{background-size:cover;background-position:center;background-attachment:fixed;background-color:var(--bg);color:var(--ink)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.orb-float{animation:orbFloat 4.5s ease-in-out infinite}
.eye-shape{display:block;width:100%;height:100%;border-radius:999px;background:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.6);transition:transform .09s ease-in}
.eye-blink .eye-shape{transform:scaleY(.08)}
.caret{display:inline-block;width:.09em;height:.9em;margin-left:.06em;vertical-align:-.08em;background:var(--caret);border-radius:2px;animation:caret 1s steps(1) infinite}
.glass{background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
/* боковая панель моделей — плотная поверхность, без «замьюченного» стекла */
#left.panel{
  background:var(--panel-surface);
  border:1px solid var(--panel-brd);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:0 18px 40px -28px var(--shadow);
}
.t-light #left.panel{background:#F7F5FC}
.t-light #left.panel .model{background:rgba(255,255,255,.92)}
.t-light #left.panel .model-on{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(110deg,#FFA235 0%,#FF7B2C 45%,#FF8F7E 78%,#F6AACF 100%) border-box}
.t-light #left.panel .model-toolbar #tabs,
.t-light #left.panel .model-toolbar:not(.search-on) .search-wrap .search,
.t-light #left.panel .model-toolbar.search-on .search-wrap .search{background:rgba(60,40,130,.06)}
.t-dark #left.panel{
  background:rgba(46,38,78,.92);
  border-color:rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 60px -30px rgba(0,0,0,.85);
}
.t-dark #left.panel .model{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.08)}
.t-dark #left.panel .model:hover{border-color:rgba(255,255,255,.2)}
.t-dark #left.panel .model-on{background:linear-gradient(rgba(46,38,78,.98),rgba(46,38,78,.98)) padding-box,linear-gradient(110deg,#FFA235 0%,#FF7B2C 45%,#FF8F7E 78%,#F6AACF 100%) border-box;box-shadow:0 0 0 1px rgba(255,162,53,.18),0 8px 18px -14px rgba(240,110,130,.55)}
.t-dark .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 60px -30px rgba(0,0,0,.85)}
.t-dark .composer.glass{background:rgba(46,38,78,.9)}
.t-dark .icon-btn:not(.icon-ghost){background:rgba(46,38,78,.86);border-color:rgba(255,255,255,.16);color:var(--ink)}
.t-dark .cabinet{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
.t-dark .field{color:var(--ink)}
.t-dark #speech{color:#fff}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.nav-item:hover{background:var(--soft);color:var(--ink)}
.nav-active{background:var(--nav-on);color:var(--ink);font-weight:600;box-shadow:0 6px 18px -10px var(--shadow)}
.seg{border:none;cursor:pointer;font-family:'Onest',sans-serif;background:transparent;color:var(--muted)}
.seg:hover{color:var(--ink)}
.seg-on{background:var(--seg-on)!important;color:var(--ink)!important;box-shadow:0 4px 12px -6px var(--shadow)}
.model{width:100%;text-align:left;cursor:pointer;font-family:'Onest',sans-serif;border:1.5px solid transparent;background:var(--card);transition:background .15s ease,box-shadow .15s ease,border-color .15s ease}
.model:hover{background:var(--soft-hover)}
.model-on{
  border-color:transparent;
  background:
    linear-gradient(var(--card-on), var(--card-on)) padding-box,
    linear-gradient(110deg, #FFA235 0%, #FF7B2C 45%, #FF8F7E 78%, #F6AACF 100%) border-box;
  box-shadow:0 0 0 1px rgba(255,162,53,.12), 0 8px 18px -14px rgba(240,110,130,.55);
}
.field{border:1px solid var(--field-brd);background:var(--field);color:var(--accent-ink)}
.prompt-input{color:var(--ink)}
.prompt-input::placeholder,.search::placeholder{color:var(--muted2)}
.prompt-input:focus{outline:none}
.composer:focus-within{box-shadow:0 0 0 4px rgba(124,77,255,.18),0 24px 60px -24px var(--shadow)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8A63FF;outline-offset:2px}
.search{border:1px solid var(--field-brd);background:var(--field);color:var(--ink)}
.search:focus{outline:none;border-color:rgba(138,99,255,.55)}
.model-toolbar{display:flex;align-items:center;gap:6px;min-height:40px;position:relative}
.model-toolbar .search-wrap{position:relative;flex:0 0 40px;min-width:40px;transition:flex-basis .28s cubic-bezier(.4,.1,.2,1),flex-grow .28s cubic-bezier(.4,.1,.2,1),min-width .28s ease;z-index:2}
.model-toolbar.search-on .search-wrap{flex:1 1 auto;min-width:0}
.model-toolbar .search-wrap .search{width:100%;box-sizing:border-box;height:40px;padding:0 10px 0 36px;border-radius:12px;font-family:'Onest',sans-serif;font-size:14px;transition:padding .2s ease}
.model-toolbar:not(.search-on) .search-wrap .search{padding:0;border-color:transparent;background:var(--seg-bg);color:transparent;caret-color:transparent;cursor:pointer}
.model-toolbar:not(.search-on) .search-wrap .search::placeholder{color:transparent}
.model-toolbar:not(.search-on) .search-wrap .search::-webkit-search-cancel-button{display:none}
.model-toolbar.search-on .search-wrap .search{background:var(--seg-bg);border-color:transparent}
.model-toolbar .search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--accent-ink);pointer-events:none;z-index:1}
.model-toolbar #tabs{flex:1 1 auto;min-width:0;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--seg-bg);overflow:hidden;transition:opacity .2s ease,flex-basis .28s ease,max-width .28s ease,padding .2s ease}
.model-toolbar.search-on #tabs{flex:0 0 0;max-width:0;opacity:0;padding-left:0;padding-right:0;pointer-events:none}
.model{border-radius:14px!important;padding:9px 11px!important;gap:10px!important;align-items:flex-start!important}
.model .m-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.model .m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0}
.model .m-meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.model .m-cost{flex:0 0 auto;max-width:46%;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.model .m-name{font-size:13px!important;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model .m-kind{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;
  border:1px solid var(--field-brd);background:var(--field);
  color:var(--muted);font-size:10px!important;font-weight:700;line-height:1;letter-spacing:.01em;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;
}
.model .m-price{font-size:12px!important;font-weight:700;line-height:1.25;white-space:nowrap}
.model .m-unit{font-size:10px!important;line-height:1.25;color:var(--muted2);white-space:nowrap}
.model .m-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.model .m-ex{
  display:inline-flex;align-items:center;gap:0;
  height:22px;padding:0 9px;border-radius:999px;
  border:1px solid var(--field-brd);background:var(--field);
  color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.01em;
  max-width:100%;cursor:pointer;box-sizing:border-box;
}
.model .m-ex:hover{color:var(--ink);border-color:rgba(255,162,53,.4);background:rgba(255,162,53,.12)}
.model-on .m-kind,.model-on .m-ex{border-color:rgba(255,162,53,.35);background:rgba(255,162,53,.1);color:var(--ink)}
.t-dark .model .m-kind,.t-dark .model .m-ex{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.ttl{scrollbar-width:thin}
.ttl{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);padding-bottom:18px!important}
.cabinet{border-radius:18px;background:var(--card-on);border:1px solid var(--glass-brd);box-shadow:0 -14px 30px -18px var(--shadow),0 10px 24px -18px var(--shadow);overflow:hidden;flex:0 0 auto}
.cab-row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:56px;box-sizing:border-box}
.cab-link{text-decoration:none;color:var(--ink)}
.cab-link:hover{background:var(--soft)}
.cab-tile{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cab-end{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted2)}


.t-light{--user-bg:#1E1238;--user-ink:#FFFFFF;--purple:#5B35E0;--purple2:#7A55FF;--purple-soft:rgba(91,53,224,.1);--purple-soft-h:rgba(91,53,224,.17);--purple-brd:rgba(91,53,224,.18);--purple-ink:#4A2CC0}
.t-dark{--user-bg:#EDE8FF;--user-ink:#1E1238;--purple:#7A55FF;--purple2:#9B7BFF;--purple-soft:rgba(155,123,255,.14);--purple-soft-h:rgba(155,123,255,.22);--purple-brd:rgba(155,123,255,.25);--purple-ink:#D2C4FF}
.btn-purple{border:1px solid var(--purple-brd);background:var(--purple-soft);color:var(--purple-ink);font-family:'Onest',sans-serif;font-weight:700;cursor:pointer}
.btn-purple:hover{background:var(--purple-soft-h)}
.btn-login{border:none;background:var(--user-bg);color:var(--user-ink);font-family:'Onest',sans-serif;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -12px var(--shadow)}
.btn-login:hover{filter:brightness(1.08)}
.t-dark .btn-login:hover{filter:brightness(0.96)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(14px);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{color:var(--ink)}
.icon-on{color:var(--ink);background:var(--nav-on)}
.icon-ghost{width:36px;height:36px;border-radius:10px;border:none;background:transparent;backdrop-filter:none;color:var(--muted)}
.icon-ghost:hover{background:var(--soft)}
.icon-btn.lang{font-family:'Onest',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em}
.eye-p{position:absolute;width:8.5%;height:27%;top:34.5%;transition:transform .28s cubic-bezier(.3,.7,.4,1)}
.eye-p.l{left:34.25%}.eye-p.r{left:57.25%}
.hero{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 24px;text-align:center;overflow:hidden;transition:flex-grow .55s cubic-bezier(.4,.1,.2,1),opacity .4s ease,transform .55s cubic-bezier(.4,.1,.2,1),padding .55s ease,max-height .55s ease;max-height:900px}
.hero-off{flex-grow:0;opacity:0;transform:scale(.22) translateY(-60%);padding:0;max-height:0;pointer-events:none}
@keyframes avLand{0%{transform:translate(160px,-220px) scale(3.6);opacity:.2}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes msgIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.av-land{animation:avLand .7s cubic-bezier(.3,.7,.3,1) both}
.msg-in{animation:msgIn .35s ease-out both}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dots 1.1s ease-in-out infinite}
.panel{transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){.orb-float,.caret,.av-land,.msg-in,.dot,.modal-ov,.modal-card,.modal-egg,.shake,#vit,#left,.vit-btn.pulse{animation:none!important}.hero{transition:none}}

.hidden{display:none!important}
.modal-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--ov);backdrop-filter:blur(8px);animation:ovIn .25s ease-out both}
.t-light{--ov:rgba(40,24,90,.22)}.t-dark{--ov:rgba(4,2,12,.6)}
@keyframes ovIn{0%{opacity:0}100%{opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes eggPop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}70%{transform:translate(-50%,-4px) scale(1.06);opacity:1}100%{transform:translate(-50%,0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modal-card{position:relative;width:100%;max-width:420px;box-sizing:border-box;border-radius:28px;padding:56px 28px 24px;background:var(--modal-bg);border:1px solid var(--glass-brd);backdrop-filter:blur(24px);box-shadow:0 40px 90px -30px var(--shadow);animation:cardIn .35s cubic-bezier(.3,.7,.3,1) both}
.t-light{--modal-bg:rgba(255,255,255,.86)}.t-dark{--modal-bg:rgba(28,22,46,.9)}
.modal-egg{position:absolute;left:50%;top:-40px;width:80px;height:80px;transform:translateX(-50%);animation:eggPop .55s .1s cubic-bezier(.3,.7,.3,1) both}
.fld{display:flex;flex-direction:column;gap:6px}
.fld-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld-in{height:50px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--field);padding:0 16px;font-family:'Onest',sans-serif;font-size:16px;color:var(--ink);box-sizing:border-box;width:100%;transition:border-color .15s ease,box-shadow .15s ease}
.fld-in::placeholder{color:var(--muted2)}
.fld-in:focus{outline:none;border-color:var(--purple2);box-shadow:0 0 0 4px rgba(122,85,255,.16)}
.fld-err .fld-in{border-color:#E0457B}
.btn-primary{height:50px;border-radius:14px;border:none;width:100%;background:linear-gradient(135deg,var(--purple2),var(--purple));color:#FFFFFF;font-family:'Onest',sans-serif;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 26px -14px rgba(91,53,224,.85)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.link-btn{border:none;background:none;padding:0;font-family:'Onest',sans-serif;font-size:14px;font-weight:600;color:var(--accent-ink);cursor:pointer;min-height:32px}
.link-btn:hover{text-decoration:underline}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--purple);flex:0 0 auto;cursor:pointer}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp-cell{height:56px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--field);display:flex;align-items:center;justify-content:center;font-family:'Days One',sans-serif;font-size:22px;color:var(--ink)}
.otp-on{border-color:var(--purple2);box-shadow:0 0 0 4px rgba(122,85,255,.16)}
.otp-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;font-size:16px;cursor:text}
.shake{animation:shake .3s ease}
.x-btn{position:absolute;right:14px;top:14px;z-index:2}
.otp-err{border-color:#E0457B}
.otp-lock{opacity:.45}
.err-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(224,69,123,.1);border:1px solid rgba(224,69,123,.28);color:#C2305F;font-size:13px;line-height:1.45}
.t-dark .err-banner{color:#FF8DB3;background:rgba(255,120,170,.1);border-color:rgba(255,120,170,.3)}
.t-dark #errE,.t-dark #errC{color:#FF8DB3!important}
.soc{display:flex;flex-direction:column;gap:8px}
.soc-btn{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--card-on);color:var(--ink);font-family:'Onest',sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.soc-btn:hover{border-color:var(--purple2);transform:translateY(-1px)}
.soc-btn[disabled]{opacity:.55;cursor:progress;transform:none}
.or{height:1px;background:var(--field-brd);border:none;margin:2px 0}
.chk-err{color:#D63B6F}
.soc-logo{width:20px;height:20px;display:block}
.soc-fb{display:none}
.soc-btn:not(:has(.soc-logo)) .soc-fb{display:flex}
.modal-egg .eye-p{width:8.5%;height:27%;top:34.5%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- адаптив панелей (studio-responsive-guide) ---- */
#scrim{position:fixed;inset:0;z-index:44;background:transparent;animation:ovIn .2s ease both}
.t-dark #scrim{background:transparent}
#vit{flex:0 1 380px;min-width:260px;max-width:380px;box-sizing:border-box;border-radius:28px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);height:calc(100vh - 32px);overflow:hidden;box-shadow:0 20px 50px -30px var(--shadow);animation:vitIn .35s cubic-bezier(.3,.7,.3,1);touch-action:pan-y;background:var(--glass)}
/* Desktop: left · main · vit in one row */
@media (min-width:980px){
  #root{flex-wrap:nowrap!important}
  #left{flex:0 1 300px;max-width:320px;min-width:220px}
  main{flex:1 1 360px!important;min-width:280px!important}
}
@keyframes vitIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vit-btn{position:relative;width:auto;padding:0 14px 0 12px;gap:8px;font-family:'Onest',sans-serif;font-size:14px;font-weight:600;color:var(--ink)}
.vit-btn[aria-pressed=true]{background:var(--seg-on);color:var(--accent-ink);box-shadow:0 8px 20px -12px var(--shadow)}
.vit-btn .cnt{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--purple);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.vit-h{display:flex;align-items:center;gap:6px;padding-left:2px}

@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:none}}

/* уже экран: колонки сжимаются, витрина остаётся в ряду */
@media (min-width:980px) and (max-width:1320px){
  #vit{flex:0 1 300px;max-width:300px;min-width:240px}

  main{flex:1 1 300px!important;min-width:260px!important}
}

/* планшет: пока витрина и слева не пересекаются — обе в ряду; центр прячется */
@media (min-width:761px) and (max-width:979px){
  #root{flex-wrap:nowrap!important}
  #root.vit-open main{display:none!important}

    position:relative!important;top:auto!important;right:auto!important;bottom:auto!important;left:auto!important;
    flex:1 1 58%!important;width:auto!important;max-width:none!important;min-width:240px!important;
    height:calc(100vh - 32px)!important;max-height:calc(100vh - 32px)!important;
    border-radius:28px!important;z-index:auto!important;animation:vitIn .35s cubic-bezier(.3,.7,.3,1)!important
  }
}

  main{height:100vh!important;height:100dvh!important;min-height:0!important;padding:10px 0 0}
  main>div:first-child{padding:0 12px!important;min-height:48px!important}
  #leftReopen .icon-btn{width:44px;height:44px}
  .vit-btn{height:44px;padding:0 12px 0 10px}
  .vit-btn .vb-t{display:none}
  .hero{padding:12px 16px!important}
  .hero>div:first-child{width:104px!important;height:104px!important;margin-bottom:14px!important}
  #speech{font-size:16px!important}
  #chat{padding:12px 12px 10px!important}
  #msgs>div{max-width:92%!important}
  #form{padding:0 8px max(8px,env(safe-area-inset-bottom))!important;margin-bottom:var(--kb,0px)!important}
  .composer{border-radius:22px!important;padding:12px 10px 10px 14px!important}
  .composer textarea{font-size:16px!important}
  .composer [data-toggle-right-open]{flex:1 1 auto;min-width:0;justify-content:flex-start;overflow:hidden}
  .composer [data-toggle-right-open] #selName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #selEst{display:none}
  .composer button[type=submit]{padding:0 14px!important;min-width:44px;min-height:44px}
  .composer button[type=submit] .sub-t{display:none}
  #vit{
    position:fixed!important;inset:0!important;width:100%!important;max-width:none!important;min-width:0!important;flex:none!important;
    height:auto!important;max-height:none!important;border-radius:0!important;z-index:46!important;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))!important;
    background:var(--bg)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
    animation:vitInR .32s cubic-bezier(.3,.7,.3,1) both
  }
  .t-dark #vit{background:#15122A!important}
  .t-light #vit{background:#EEEAF8!important}
  .vit-grid{columns:2}
  .vit-hint{padding:0 8px;margin-bottom:8px}

  .modal-card{max-width:none;border-radius:28px 28px 0 0;padding:52px 20px max(20px,env(safe-area-inset-bottom))}
}
@media (pointer:coarse){
  .icon-ghost{width:44px!important;height:44px!important}

}
@media (prefers-reduced-motion:reduce){
  #vit,#left,.vit-btn.pulse{animation:none!important}
}

    if (q === 'light' || q === 'dark') return q;
    const v = localStorage.getItem('aish-vitrina-theme');
    if (v === 'light' || v === 'dark') return v;
    const t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') return t;
  } catch (e) {}
  return 'light';
}
function writeSharedTheme(name) {
  try {
    localStorage.setItem('aish-vitrina-theme', name);
    localStorage.setItem('theme', name);
  } catch (e) {}
}

async function ensureCsrf() {
  if (window.__csrfToken) return window.__csrfToken;
  const m = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
  if (m) { window.__csrfToken = decodeURIComponent(m[1]); return window.__csrfToken; }
  const res = await fetch('/api/csrf', { credentials: 'same-origin' });
  const data = await res.json().catch(() => ({}));
  window.__csrfToken = data.csrf_token || '';
  return window.__csrfToken;
}
async function api(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = await ensureCsrf();

  let data = {};

function parsePriceRub(s) {
  const m = String(s || '').replace(/\u00a0/g, ' ').match(/(\d+[.,]?\d*)/);
  if (!m) return 0;
  return parseFloat(m[1].replace(',', '.')) || 0;
}

/** Compact API price for sidebar: "4,3 ₽ / сек видео at 480p" → "от 4,3 ₽/сек" */
function shortPriceLabel(raw) {
  let s = String(raw || '').replace(/\u00a0/g, ' ').trim();
  if (!s) return '';
  const hasTiers = s.includes('·') || /at\s*\d+p/i.test(s) || /480p|720p|1080p/i.test(s);
  s = s.split('·')[0].trim();
  const m = s.match(/(\d+[.,]?\d*)\s*₽/);
  if (!m) return s.length > 28 ? s.slice(0, 26) + '…' : s;
  const num = m[1];
  let core = num + ' ₽';
  if (/\/\s*сек|per\s*sec|\/\s*s\b/i.test(s)) core = num + ' ₽/сек';
  else if (/млн|\/\s*1m|token/i.test(s)) core = num + ' ₽/млн';
  else if (/изобр|image|картин/i.test(s)) core = num + ' ₽/фото';
  if (hasTiers && !/^от\s/i.test(core)) return 'от ' + core;
  return core;
}

function priceUnitHint(raw) {
  const s = String(raw || '');
  if (/\/\s*сек|per\s*sec/i.test(s)) return 'за секунду';
  if (/млн|token/i.test(s)) return 'за 1 млн токенов';
  if (/изобр|image|картин/i.test(s)) return 'за картинку';
  return '';
}

function integrationType(it) {
  const kind = String(it.kind || '').toLowerCase();
  const outs = it.outputs || [];
  const ins = it.inputs || [];
  if (it.is_assistant || kind === 'llm' || kind === 'chat') return 'text';
  if (kind === 'video' || outs.indexOf('video') >= 0) return 'video';
  if (kind === 'audio' || kind === 'stt' || outs.indexOf('audio') >= 0 || outs.indexOf('music') >= 0) return 'music';
  if (kind === 'image' || outs.indexOf('image') >= 0) return 'image';
  if (outs.indexOf('text') >= 0 && outs.length === 1) return 'text';
  if (ins.indexOf('image') >= 0 && outs.indexOf('video') >= 0) return 'video';
  return 'image';
}

function integrationKindLabel(it, type) {
  if (it.is_assistant || it.kind === 'llm' || it.kind === 'chat') return tr('studio.kind.assistant');
  if (type === 'text') return tr('studio.kind.text');
  if (type === 'music') return tr('studio.kind.audio');
  if (type === 'video' && (it.inputs || []).indexOf('image') >= 0) return tr('studio.kind.imageToVideo');
  if (type === 'video') return tr('studio.kind.videoSound');
  return tr('studio.kind.image');
}

function integrationDisplayName(name) {
  return String(name || '')
    .replace(/^Ассистент\s*[·•\-—]\s*/i, '')
    .replace(/\bOmniRoute\b/gi, '')
    .replace(/\bReplicate\b/gi, '')
    .replace(/\bfal(?:\.ai)?\b/gi, '')
    .replace(/\s*[·•\-—]\s*$/g, '')
    .replace(/^\s*[·•\-—]\s*/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim() || name;
}

async function loadIntegrations() {
  try {
    const { res, data } = await api('/api/integrations');
    if (!res.ok) return;
    const items = data.items || [];
    if (!items.length) return;
    const mapped = items.map((it) => {
      const type = integrationType(it);
      const priceRaw = (it.price_full || it.price || '').trim();
      const rub = parsePriceRub(priceRaw);
      const free = /бесплат|free/i.test(priceRaw) || (!priceRaw && (it.is_assistant || it.provider === 'omniroute'));
      const viaGenerate = !!(it.is_assistant || type === 'text' || it.provider === 'replicate' || it.provider === 'fal' || it.provider === 'omniroute');
      const thumb = (it.image_url || it.cover_url || '').trim();
      const example = (it.example_url || it.example_image || thumb).trim();
      const exampleVideo = (it.example_video_url || '').trim();
      return app.priceModel({
        slug: it.id,
        model_key: it.id,
        name: integrationDisplayName(it.name),
        type: type,
        kind: integrationKindLabel(it, type),
        cost: free ? 0 : (rub || 9999),
        rub: free ? 0 : rub,
        perSec: /\/\s*с|сек/i.test(priceRaw),
        priceFromApi: free ? '' : priceRaw,
        unitFromApi: '',
        integrated: true,
        viaGenerate: viaGenerate,
        provider: it.provider,
        thumb: thumb,
        example: example,
        exampleVideo: exampleVideo
      });
    });
    if (!mapped.length) return;
    app.MODELS = mapped;
    const aliasSel = {
      'wan-3-0-t2v-fal': 'wan-3-0',
      'wan-3-0-i2v-fal': 'wan-3-0',
      'grok-imagine-video-1-5-i2v-fal': 'grok-imagine-video-1-5'
    };
    if (aliasSel[app.state.sel] && mapped.some((m) => m.slug === aliasSel[app.state.sel])) {
      app.setState({ sel: aliasSel[app.state.sel] });
    }
    const still = mapped.some((m) => m.slug === app.state.sel);
    if (!still) {
      const prefer = mapped.find((m) => m.slug === 'wan-3-0')
        || mapped.find((m) => m.slug === 'seedream-5-pro')
        || mapped.find((m) => m.slug === 'grok-imagine-video-1-5')
        || mapped.find((m) => m.type === 'video')
        || mapped[0];
      if (prefer) app.setState({ sel: prefer.slug });
    }
    lastModelsKey = '';
    scheduleRender();
    if (window.renderVit) {
      try { window.renderVit(); } catch (_) {}
    }
  } catch (_) {}
}

  const D = window.VITRINA || { works: [], creators: [] };
  const CR = Object.fromEntries((D.creators || []).map((c) => [c.id, c]));
  let WORKS = (D.works || []).filter((w) => w.published !== false);
  const MODEL_OF = {
    'seedance-lite': 'Seedance 1.0 Lite',
    'seedream-5-lite': 'Seedream 5 Lite',
    'seedream-5-pro': 'Seedream 5 Pro',
    'kling-o3-i2v': 'Kling O3',
    'kling-v2-5-turbo-pro': 'Kling 2.5 Turbo Pro',
    'pixverse-v6': 'PixVerse V6',
    'p-video': 'P-Video',
    'gen4-turbo': 'Gen-4 Turbo',
    'hailuo-02': 'Hailuo 02',
    'wan-3-0': 'Wan 3.0',
    'grok-imagine-video-1-5': 'Grok Imagine Video 1.5',
    'seedance-2-5': 'Seedance 2.5',
    'veo-3-1': 'Veo 3.1',
    'veo-3-1-fast': 'Veo 3.1 Fast',
    'seedream-5-pro': 'Seedream 5.0 Pro',
    'gpt-image-2': 'GPT Image 2',
    'gpt-image-2-5-flare': 'GPT Image 2.5 Flare',
    'gpt-image-2-5-sunburst': 'GPT Image 2.5 Sunburst',
    'nano-banana-2': 'Nano Banana 2',
    'ideogram-v3-turbo': 'Ideogram v3 Turbo',
    'ace-step': 'ACE-Step',
    'elevenlabs-music': 'ElevenLabs Music'
  };
  // MOBILE/TABLET/SHEET — из внешнего scope
  const wTitle = (w) => L.workTitle(w);
  function sameModel(w, m, mName) {
    if (!w || !m) return false;
    const wm = String(w.model || '');
    const slug = String(m.slug || '');
    if (w.model_slug && w.model_slug === slug) return true;
    if (mName && wm === mName) return true;
    if (wm === m.name) return true;
    if (/wan[-_]?3/i.test(slug) && /^Wan/i.test(wm)) return true;
    if (/grok[-_]?imagine/i.test(slug) && /^Grok/i.test(wm)) return true;
    if (/seedance/i.test(slug) && /^Seedance/i.test(wm)) return true;
    if (/veo-3-1-fast/i.test(slug) && /Veo\s*3\.1\s*Fast/i.test(wm)) return true;
    if (/(^|[^\w-])veo-3-1($|[^\w-])/i.test(slug) && /^Veo\s*3\.1(?!\s*Fast)/i.test(wm)) return true;
    if (/kling/i.test(slug) && /^Kling/i.test(wm)) return true;
    if (/pixverse/i.test(slug) && /^PixVerse/i.test(wm)) return true;
    if (/p-video|pvideo/i.test(slug) && /^P-?Video/i.test(wm)) return true;
    if (/gen4-turbo/i.test(slug) && /Gen-?4\s*Turbo/i.test(wm)) return true;
    if (/hailuo-02/i.test(slug) && /Hailuo\s*0?2/i.test(wm)) return true;
    if (/ideogram-v3-turbo/i.test(slug) && /Ideogram/i.test(wm)) return true;
    if (/ace-step/i.test(slug) && /ACE-?Step/i.test(wm)) return true;
    if (/elevenlabs-music/i.test(slug) && /ElevenLabs\s*Music/i.test(wm)) return true;
    if (/seedream-5-pro|seedream-5-pro-/i.test(slug) && /Seedream 5 Pro/i.test(wm)) return true;
    if (/seedream-5-lite|seedream-5-lite-/i.test(slug) && /Seedream 5 Lite/i.test(wm)) return true;
    if (/gpt-image-2-5-flare/i.test(slug) && /GPT\s*Image\s*2\.5\s*Flare/i.test(wm)) return true;
    if (/gpt-image-2-5-sunburst/i.test(slug) && /GPT\s*Image\s*2\.5\s*Sunburst/i.test(wm)) return true;
    if (/(^|[^\w-])gpt-image-2($|[^\w-])/i.test(slug) && /^GPT\s*Image\s*2(?!\.5)/i.test(wm)) return true;
    if (/nano-banana-2/i.test(slug) && /Nano\s*Banana\s*2/i.test(wm)) return true;
    if (/seedream/i.test(slug) && /Seedream/i.test(wm)) return true;
    const token = String(m.name || '').trim().split(/\s+/)[0];
    if (token && token.length >= 3 && new RegExp('^' + token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(wm)) return true;
    return false;
  }
  function syncExampleWorks() {
    const base = (D.works || []).filter((w) => w.published !== false);
    const seen = new Set(base.map((w) => w.id));
    const extras = [];
    (app.MODELS || []).forEach((m) => {
      const video = (m.exampleVideo || '').trim();
      const still = (m.example || m.thumb || '').trim();
      if (!video && !still) return;
      if (m.type === 'text' || m.type === 'music') return;
      const id = 'ex-' + m.slug;
      if (seen.has(id)) return;
      // skip if static catalog already has this model_slug
      if (base.some((w) => w.model_slug === m.slug || sameModel(w, m, MODEL_OF[m.slug]))) return;
      seen.add(id);
      extras.push({
        id: id,
        title: tr('studio.model.examples') + ' · ' + m.name,
        model: m.name,
        model_slug: m.slug,
        type: m.type === 'video' || video ? 'video' : 'image',
        dur: video ? '' : '',
        creator: 'c1',
        likes: 0,
        date: '',
        w: 1280,
        h: 720,
        src: still || video,
        video: video || '',
        published: true
      });
    });
    WORKS = extras.concat(base);
  }
  let open = false, preview = null, pvMode = 'view', lastKey = '', timer = 0, lastSent = null;
  let modelFilter = true, lastSel = '';
  const $ = (id) => document.getElementById(id);
  const esc2 = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const modelObj = () => app.MODELS.find((m) => m.slug === app.state.sel) || app.MODELS[1];
  /** Human meta under preview title: «качество 480p (720×406) · 5 сек» */
  function resTier(vw, vh) {
    const w = Math.round(Number(vw) || 0);
    const h = Math.round(Number(vh) || 0);
    if (!w || !h) return '';
    const long = Math.max(w, h);
    const short = Math.min(w, h);
    if (long >= 1800 || short >= 1000) return '1080p';
    if (long >= 1100 || short >= 680) return '720p';
    if (long >= 640 || short >= 360) return '480p';
    return '';
  }
  function durSeconds(work, vid) {
    if (vid && vid.duration && isFinite(vid.duration) && vid.duration > 0) return Math.round(vid.duration);
    const raw = String(work.dur || '').trim();
    if (!raw) return 0;
    if (/^\d+$/.test(raw)) return parseInt(raw, 10) || 0;
    const m = raw.match(/^(\d+)\s*:\s*(\d+)$/);
    if (m) return (parseInt(m[1], 10) || 0) * 60 + (parseInt(m[2], 10) || 0);
    const sec = raw.match(/(\d+)\s*с/i);
    if (sec) return parseInt(sec[1], 10) || 0;
    return 0;
  }
  function videoMetaText(work, vid) {
    const w = Math.round(Number((vid && vid.videoWidth) || work.w) || 0);
    const h = Math.round(Number((vid && vid.videoHeight) || work.h) || 0);
    const parts = [];
    if (w && h) {
      const size = w + '\u00d7' + h;
      const tier = resTier(w, h);
      parts.push(tier ? tr('studio.vit.meta.resTier', { tier: tier, size: size }) : tr('studio.vit.meta.res', { size: size }));
    }
    const n = durSeconds(work, vid);
    if (n > 0) {
      work.dur = Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
      parts.push(tr('studio.vit.meta.dur', { n: n }));
    }
    return parts.join(' \u00b7 ');
  }
  function fillVideoMeta(root, work) {
    const vid = root && root.querySelector('video');
    const badge = root && root.querySelector('.vc-res');
    if (!badge) return;
    const paint = () => {
      if (vid && vid.videoWidth && vid.videoHeight) {
        work.w = vid.videoWidth;
        work.h = vid.videoHeight;
      }
      badge.textContent = videoMetaText(work, vid);
    };
    if (!vid) { paint(); return; }
    if (vid.readyState >= 1) paint();
    else vid.addEventListener('loadedmetadata', paint, { once: true });
  }
  const card = (w) => {
    const aw = Number(w.w) || 16;
    const ah = Number(w.h) || 9;
    const ratio = aw + ' / ' + ah;
    const poster = (w.src || '').trim();
    const media = w.video
      ? '<video src="' + esc2(w.video) + '"' + (poster ? ' poster="' + esc2(poster) + '"' : '')
        + ' muted loop playsinline autoplay preload="metadata" style="aspect-ratio:' + ratio + ';object-fit:cover;width:100%;height:auto"></video>'
      : '<img src="' + esc2(poster) + '" alt="" loading="lazy" width="' + aw + '" height="' + ah + '" style="aspect-ratio:' + ratio + ';object-fit:cover;width:100%;height:auto">';
    const cardDur = (() => {
      const n = durSeconds(w, null);
      return n > 0 ? tr('studio.vit.meta.dur', { n: n }) : (w.dur || '');
    })();
    return '<button class="vit-card" data-w="' + w.id + '" aria-label="' + esc2(wTitle(w) || w.title || '') + '">' + media
      + (w.type === 'video' || w.video ? '<span class="vc-p">▶ ' + esc2(cardDur) + '</span>' : '')
      + '<span class="vc-t">' + esc2(wTitle(w) || w.title || '') + '</span></button>';
  };
  function compute() {
    syncExampleWorks();
    if (app.state.sel !== lastSel) { lastSel = app.state.sel; modelFilter = true; }
    const m = modelObj(), mName = MODEL_OF[m.slug] || m.name;
    let mw = [];
    if (modelFilter) {
      mw = WORKS.filter((w) => sameModel(w, m, mName)).sort((a, b) => (b.likes || 0) - (a.likes || 0)).slice(0, 24);
    } else {
      mw = WORKS.slice().sort((a, b) => (b.likes || 0) - (a.likes || 0));
    }
    return { m, mName, mw, modelFilter };
  }
  function syncScrim() { if (typeof updateStudioScrim === 'function') updateStudioScrim(); }
  function draw() {
    const r = compute();
    const n = r.mw.length;
    $('vitCnt').textContent = n;
    $('vitCnt').classList.toggle('hidden', !n || open);
    $('vitHint').classList.add('hidden');
    const ids = r.mw.map((w) => w.id);
    const full = '/explore' + (ids.length ? '?ids=' + ids.join(',') + '&from=studio' : '');
    $('vitFull2').href = full;
    if (!open) return;
    if (preview) return drawPreview(preview);
    const boldVal = (key, name, val) => esc2(tr(key, { [name]: '\u0000' })).replace('\u0000', '<b>' + esc2(val) + '</b>');
    const modelChip = r.modelFilter
      ? '<span>' + boldVal('studio.vit.model', 'model', r.m.name)
        + '<button type="button" class="vit-chip-x" data-clear-model aria-label="' + esc2(tr('studio.vit.clearModel')) + '" title="' + esc2(tr('studio.vit.clearModel')) + '">×</button></span>'
      : '';
    $('vitCtx').innerHTML = modelChip;
    const list = r.mw;
    let h = '<section class="vit-sec">';
    if (list.length) h += '<div class="vit-grid">' + list.map(card).join('') + '</div>';
    else if (r.modelFilter && r.m.type === 'music') h += '<div class="vit-empty">' + esc2(tr('studio.vit.empty.music')) + '</div>';
    else if (r.modelFilter && r.m.type === 'text') h += '<div class="vit-empty">' + esc2(tr('studio.vit.empty.text')) + '</div>';
    else h += '<div class="vit-empty">' + esc2(tr('studio.vit.empty.none')) + '</div>';
    h += '</section>';
    $('vitBody').innerHTML = h;
  }
  function drawPreview(id) {
    const w = WORKS.find((x) => x.id === id) || D.works.find((x) => x.id === id); if (!w) { preview = null; pvMode = 'view'; return draw(); }
    const c = CR[w.creator] || { id: w.creator, name: tr('vitrina.creator.fallback'), nick: '', works: 0, grad: '#FF8A2B,#F2668B' };
    const media = w.video
      ? '<video src="' + esc2(w.video) + '" poster="' + esc2(w.src) + '" autoplay muted loop playsinline preload="metadata"></video>'
      : '<img src="' + esc2(w.src) + '" alt="' + esc2(wTitle(w) || w.title || '') + '">';
    const resBadge = '<p class="vc-res">' + esc2(videoMetaText(w, null)) + '</p>';
    const slug = w.model_slug
      || Object.keys(MODEL_OF).find((k) => MODEL_OF[k] === w.model)
      || (/^Wan/i.test(w.model) ? 'wan-3-0' : /^Grok/i.test(w.model) ? 'grok-imagine-video-1-5' : /^Seedance/i.test(w.model) ? 'seedance-2-5' : /Veo\s*3\.1\s*Fast/i.test(w.model) ? 'veo-3-1-fast' : /^Veo/i.test(w.model) ? 'veo-3-1' : /^Kling/i.test(w.model) ? 'kling-v2-5-turbo-pro' : /^PixVerse/i.test(w.model) ? 'pixverse-v6' : /^P-?Video/i.test(w.model) ? 'p-video' : /Gen-?4\s*Turbo/i.test(w.model) ? 'gen4-turbo' : /Hailuo\s*0?2/i.test(w.model) ? 'hailuo-02' : /Seedream/i.test(w.model) ? 'seedream-5-pro' : /GPT\s*Image\s*2\.5\s*Flare/i.test(w.model) ? 'gpt-image-2-5-flare' : /GPT\s*Image\s*2\.5\s*Sunburst/i.test(w.model) ? 'gpt-image-2-5-sunburst' : /^GPT\s*Image\s*2(?!\.5)/i.test(w.model) ? 'gpt-image-2' : /Nano\s*Banana\s*2/i.test(w.model) ? 'nano-banana-2' : /Ideogram/i.test(w.model) ? 'ideogram-v3-turbo' : /ACE-?Step/i.test(w.model) ? 'ace-step' : /ElevenLabs\s*Music/i.test(w.model) ? 'elevenlabs-music' : null);
    const slugName = slug ? (app.MODELS.find((m) => m.slug === slug) || {}).name : '';
    const handle = c.nick || c.handle || '';
    const cHref = handle
      ? '/@' + encodeURIComponent(handle.replace(/^@/, ''))
      : '/creator?c=' + encodeURIComponent(c.id || w.creator);
    const more = (D.works || []).filter((x) => x.creator === w.creator && x.id !== w.id && x.published !== false).slice(0, 3);
    const chevron = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
    const spark = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>';
    const check = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>';
    const ava = '<span class="ava" style="width:48px;height:48px;font-size:19px;background:linear-gradient(135deg,' + esc2(c.grad || '#FF8A2B,#F2668B') + ')">' + esc2((L.creatorName(c) || '?')[0]) + '</span>';
    const reqLbl = esc2(tr(w.type === 'video' ? 'vitrina.req.promptOrVideo' : 'vitrina.req.promptOrOriginal'));
    const cName = L.creatorName(c);
    const moreRow = more.length
      ? '<div class="c-more">' + more.map((m) => '<button type="button" data-go="' + esc2(m.id) + '" aria-label="' + esc2(wTitle(m)) + '"><img src="' + esc2(m.src) + '" alt=""></button>').join('') + '</div>'
      : '';
    let lower = '';
    if (pvMode === 'request') {
      /* значения fmt остаются русскими (канонический вид в AISH_REQ), показываются по языку */
      lower = '<form class="req" id="vitReqForm"><h3>' + esc2(tr('vitrina.req.title', { name: cName || tr('vitrina.req.fallbackName') })) + '</h3>'
        + '<p>' + esc2(tr('vitrina.req.note')) + '</p>'
        + '<label>' + esc2(tr('vitrina.req.kind')) + '<select name="kind"><option value="prompt">' + esc2(tr('vitrina.req.kind.prompt')) + '</option><option value="original">' + esc2(tr(w.type === 'video' ? 'vitrina.req.kind.originalVideo' : 'vitrina.req.kind.originalImage')) + '</option></select></label>'
        + '<label>' + esc2(tr('vitrina.req.message')) + '<textarea name="msg" required>' + esc2(tr('vitrina.req.message.default', { title: wTitle(w) })) + '</textarea></label>'
        + '<label>' + esc2(tr('vitrina.req.contact')) + '<input name="contact" type="text" placeholder="' + esc2(tr('vitrina.req.contact.placeholder')) + '"></label>'
        + '<div class="row2"><button type="button" class="btn-purple" data-vact="back">' + esc2(tr('common.back')) + '</button><button type="submit" class="btn-primary">' + esc2(tr('vitrina.req.send')) + '</button></div></form>';
    } else if (pvMode === 'sent') {
      const authed = !!(lastSent && lastSent.authed);
      const chatHref = lastSent && lastSent.threadId
        ? '/account#messages/' + encodeURIComponent(lastSent.threadId)
        : (authed ? '/account#messages' : '/auth?next=' + encodeURIComponent('/account'));
      const chatLbl = (lastSent && lastSent.threadId) || authed ? tr('vitrina.req.sent.goChat') : tr('vitrina.req.sent.goAuth');
      lower = '<div class="req"><div class="ok"><span class="check">' + check + '</span><h3>' + esc2(tr('vitrina.req.sent.title')) + '</h3><p>' + esc2(tr('vitrina.req.sent.text', { name: cName || tr('vitrina.creator.fallback') })) + '</p>'
        + '<a class="btn-primary" href="' + chatHref + '" style="width:100%;margin-top:12px;min-height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box">' + esc2(chatLbl) + '</a>'
        + '<button type="button" class="btn-purple" data-vact="back" style="width:100%;margin-top:8px;min-height:46px;border-radius:14px">' + esc2(tr('vitrina.req.sent.back')) + '</button></div></div>';
    }
    const creatorCard = '<section class="creator" aria-label="' + esc2(tr('vitrina.creator.aria')) + '"><div class="c-head">' + ava
      + '<div class="c-main"><a class="c-name" href="' + cHref + '"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc2(cName || tr('vitrina.creator.fallback')) + '</span><span class="c-go" aria-hidden="true">' + chevron + '</span></a>'
      + '<div class="c-sub">' + (handle ? '@' + esc2(handle) : '') + (c.works ? (handle ? ' · ' : '') + esc2(tr('vitrina.creator.works', { n: c.works })) : '') + '</div></div></div>'
      + (pvMode === 'view' ? '<div class="c-act"><a class="btn-profile" href="' + cHref + '">' + esc2(tr('vitrina.creator.viewProfile')) + '</a><button type="button" class="btn-primary" data-vreq>' + spark + reqLbl + '</button></div>' : '')
      + moreRow + '</section>';
    const modelLabel = slugName || w.model || '';
    const genBtn = modelLabel
      ? '<div class="acts">' + (slug
        ? '<button type="button" class="btn-purple btn-gen" data-vuse="' + esc2(slug) + '">' + esc2(tr('studio.vit.generateIn', { model: modelLabel })) + '</button>'
        : '<a class="btn-gen" href="/app?model=' + encodeURIComponent(String(w.model || '').toLowerCase().replace(/\s+/g, '-')) + '">' + esc2(tr('studio.vit.generateIn', { model: modelLabel })) + '</a>')
        + '</div>'
      : '';
    $('vitCtx').innerHTML = '';
    $('vitBody').innerHTML = '<div class="vit-pv"><button type="button" class="vit-back" data-vback>' + esc2(tr('studio.vit.back')) + '</button><div class="media">' + media + '</div>'
      + '<h4>' + esc2(wTitle(w)) + '</h4>'
      + resBadge
      + genBtn + creatorCard + lower + '</div>';
    fillVideoMeta($('vitBody').querySelector('.vit-pv'), w);
    const f = $('vitReqForm');
    if (f) {
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(f);
        const kind = fd.get('kind') || 'prompt';
        const creatorKey = (c.handle || c.nick || w.creator || '').toString().replace(/^@/, '');
        const payload = {
          creator: creatorKey,
          creatorName: cName || '',
          work: w.id,
          workTitle: wTitle(w),
          workSrc: w.src || '',
          kind: kind,
          fmt: '',
          msg: fd.get('msg') || '',
          contact: fd.get('contact') || '',
        };
        if (window.AISH_REQ) window.AISH_REQ.add(payload);
        let threadId = null;
        let authed = false;
        try {
          const me = await api('/api/auth/me');
          if (!me.data || !me.data.user) {
            try { sessionStorage.setItem('aish-pending-req', JSON.stringify(payload)); } catch (_) {}
            lastSent = { threadId: null, authed: false };
            pvMode = 'sent';
            drawPreview(w.id);
            $('vitBody').scrollTop = 0;
            return;
          }
          authed = true;
          const text = payload.msg + (payload.contact ? '\n\nВнешний контакт: ' + payload.contact : '');
          const { res, data } = await api('/api/threads', {
            method: 'POST',
            body: JSON.stringify({
              workId: w.id,
              workTitle: payload.workTitle || '',
              workSrc: payload.workSrc || '',
              kind: kind,
              text,
              fmt: '',
              creator: creatorKey,
              creatorName: payload.creatorName,
            }),
          });
          if (res.ok && data.threadId) threadId = String(data.threadId);
        } catch (_) {}
        if (authed && threadId) {
          location.assign('/account#messages/' + encodeURIComponent(threadId));
          return;
        }
        lastSent = { threadId: threadId || null, authed: authed };
        pvMode = 'sent';
        drawPreview(w.id);
        $('vitBody').scrollTop = 0;
      });
    }
  }
  let leftWasOpen = false;
  function setOpen(v) {
    /* Phone: vit covers full screen — close left drawer. Tablet: both stay side-by-side. */
    if (v && MOBILE() && app.state.leftOpen) {
      leftWasOpen = false;
      app.setState({ leftOpen: false });
    }
    open = v;
    preview = null;
    pvMode = 'view';
    $('vit').classList.toggle('hidden', !v);
    $('vitBtn').classList.toggle('hidden', !!v);
    $('vitBtn').setAttribute('aria-pressed', v ? 'true' : 'false');
    const root = document.getElementById('root');
    if (root) root.classList.toggle('vit-open', !!v);
    lastKey = '';
    syncScrim();
    draw();
    try {
      if (v) $('vitClose').focus({ preventScroll: true });
      else $('vitBtn').focus({ preventScroll: true });
    } catch (e) {}
  }
  window.renderVit = function () {
    const key = app.state.sel + '|' + open + '|' + app.state.chat + '|' + modelFilter;
    if (key === lastKey) return; lastKey = key;
    clearTimeout(timer); timer = setTimeout(draw, 250);
  };
  window.vitIsOpen = () => open;
  window.vitClose = () => setOpen(false);
  window.vitMarkLeftRestore = (v) => { leftWasOpen = !!v; };
  window.vitOpenForModel = (slug) => {
    const id = String(slug || app.state.sel || '').trim();
    if (id && app.state.sel !== id) app.setState({ sel: id });
    modelFilter = true;
    lastSel = id || app.state.sel;
    preview = null;
    pvMode = 'view';
    lastKey = '';
    setOpen(true);
  };
  $('vitBtn').addEventListener('click', () => setOpen(!open));
  $('vitClose').addEventListener('click', () => setOpen(false));
  $('vitHintBtn').addEventListener('click', () => setOpen(true));
  $('vitHintX').addEventListener('click', () => { $('vitHint').classList.add('hidden'); });
  $('vitCtx').addEventListener('click', (e) => {
    if (!e.target.closest('[data-clear-model]')) return;
    modelFilter = false;
    lastKey = '';
    draw();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open && !app.state.modal) setOpen(false); });

  function swipe(el, dir, close) {
    let x0 = null, y0 = 0, dx = 0;
    el.addEventListener('touchstart', (e) => { if (!SHEET()) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      if (x0 == null) return;
      dx = e.touches[0].clientX - x0;
      if (Math.abs(e.touches[0].clientY - y0) > Math.abs(dx)) { x0 = null; el.style.transform = ''; return; }
      if (dx * dir > 0) el.style.transform = 'translateX(' + dx + 'px)';
    }, { passive: true });
    el.addEventListener('touchend', () => { if (x0 == null) return; el.style.transform = ''; if (dx * dir > 80) close(); x0 = null; });
  }
  swipe($('vit'), 1, () => setOpen(false));
  swipe($('left'), -1, () => { if (MOBILE() && app.state.leftOpen) app.setState({ leftOpen: false }); });

  let pushed = false;
  const sheetOpen = () => SHEET() && (open || (app.state.leftOpen && MOBILE()));
  setInterval(() => {
    const o = sheetOpen();
    if (o && !pushed) { try { history.pushState({ sheet: 1 }, ''); } catch (e) {} pushed = true; }
    else if (!o && pushed) { pushed = false; try { if (history.state && history.state.sheet) history.back(); } catch (e) {} }
  }, 250);
  addEventListener('popstate', () => {
    if (!pushed) return;
    pushed = false;
    if (open) setOpen(false);
    else if (MOBILE() && app.state.leftOpen) app.setState({ leftOpen: false });
  });

  if (window.visualViewport) {
    const fit = () => document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - visualViewport.height - visualViewport.offsetTop) + 'px');
    visualViewport.addEventListener('resize', fit);
    visualViewport.addEventListener('scroll', fit);
    fit();
  }
  $('vitBody').addEventListener('click', (e) => {
    const c = e.target.closest('[data-w]'); if (c) { preview = c.dataset.w; pvMode = 'view'; drawPreview(preview); $('vitBody').scrollTop = 0; return; }
    const go = e.target.closest('[data-go]'); if (go) { preview = go.dataset.go; pvMode = 'view'; drawPreview(preview); $('vitBody').scrollTop = 0; return; }
    if (e.target.closest('[data-vback]')) { preview = null; pvMode = 'view'; draw(); return; }
    if (e.target.closest('[data-vreq]')) { pvMode = 'request'; if (preview) drawPreview(preview); $('vitBody').scrollTop = $('vitBody').scrollHeight; return; }
    if (e.target.closest('[data-vact="back"]')) { pvMode = 'view'; if (preview) drawPreview(preview); return; }
    const u = e.target.closest('[data-vuse]');
    if (u) {
      const m = app.MODELS.find((x) => x.slug === u.dataset.vuse);
      if (m) {
        /* Close only when shutters fully cover the studio (phone sheet / tablet both open). */
        if (SHUTTERS_COVER()) {
          setOpen(false);
          leftWasOpen = false;
          app.setState({ sel: m.slug, leftOpen: false, chat: false });
        } else {
          app.setState({ sel: m.slug, chat: false });
        }
        app.speak(tr('studio.eggy.sameModel', { model: m.name }));
        try { $('prompt').focus({ preventScroll: true }); } catch (err) {}
      }
      return;
    }
  });
  draw();
})();

</script>
</body>
</html>
