<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{AI}-шница — Студия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#EEEAF8}
.t-light{--bg:#EEEAF8;--ink:#1E1238;--muted:#5B4D93;--muted2:#6E62A3;--glass:rgba(255,255,255,.66);--glass-brd:rgba(255,255,255,.95);--soft:rgba(255,255,255,.6);--soft-hover:rgba(255,255,255,.95);--field:rgba(244,241,252,.85);--field-brd:rgba(80,60,160,.12);--nav-on:rgba(255,255,255,.95);--seg-bg:rgba(60,40,130,.07);--seg-on:#FFFFFF;--card:rgba(255,255,255,.6);--card-on:#FFFFFF;--accent-ink:#4B2BB8;--shadow:rgba(75,43,184,.28);--free:#B5470C;--caret:#E8691C;--bubble-tail:rgba(255,255,255,.66)}
.t-dark{--bg:#100E1A;--ink:#F3F0FF;--muted:#B3A9DC;--muted2:#9C92C8;--glass:rgba(24,20,40,.62);--glass-brd:rgba(255,255,255,.08);--soft:rgba(255,255,255,.06);--soft-hover:rgba(255,255,255,.12);--field:rgba(255,255,255,.06);--field-brd:rgba(255,255,255,.1);--nav-on:rgba(255,255,255,.1);--seg-bg:rgba(255,255,255,.05);--seg-on:rgba(255,255,255,.14);--card:rgba(255,255,255,.05);--card-on:rgba(255,255,255,.11);--accent-ink:#C9BCFF;--shadow:rgba(0,0,0,.55);--free:#FFA35C;--caret:#FF9A3D;--bubble-tail:rgba(24,20,40,.62)}
.bg-light{background-image:url(assets/bg-light.jpg)}
.bg-dark{background-image:url(assets/bg-dark.jpg)}
.page-bg{background-size:cover;background-position:center;background-attachment:fixed;background-color:var(--bg);color:var(--ink)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.orb-float{animation:orbFloat 4.5s ease-in-out infinite}
.eye-shape{display:block;width:100%;height:100%;border-radius:999px;background:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.6);transition:transform .09s ease-in}
.eye-blink .eye-shape{transform:scaleY(.08)}
.caret{display:inline-block;width:.09em;height:.9em;margin-left:.06em;vertical-align:-.08em;background:var(--caret);border-radius:2px;animation:caret 1s steps(1) infinite}
.glass{background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(18px)}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.nav-item:hover{background:var(--soft);color:var(--ink)}
.nav-active{background:var(--nav-on);color:var(--ink);font-weight:600;box-shadow:0 6px 18px -10px var(--shadow)}
.seg{border:none;cursor:pointer;font-family:'Onest',sans-serif;background:transparent;color:var(--muted)}
.seg:hover{color:var(--ink)}
.seg-on{background:var(--seg-on)!important;color:var(--ink)!important;box-shadow:0 4px 12px -6px var(--shadow)}
.model{width:100%;text-align:left;cursor:pointer;font-family:'Onest',sans-serif;border:1.5px solid transparent;background:var(--card);transition:background .15s ease,box-shadow .15s ease,border-color .15s ease}
.model:hover{background:var(--soft-hover)}
.model-on{
  border-color:transparent;
  background:
    linear-gradient(var(--card-on), var(--card-on)) padding-box,
    linear-gradient(110deg, #FFA235 0%, #FF7B2C 45%, #FF8F7E 78%, #F6AACF 100%) border-box;
  box-shadow:0 0 0 1px rgba(255,162,53,.12), 0 8px 18px -14px rgba(240,110,130,.55);
}
.field{border:1px solid var(--field-brd);background:var(--field);color:var(--accent-ink)}
.prompt-input{color:var(--ink)}
.prompt-input::placeholder,.search::placeholder{color:var(--muted2)}
.prompt-input:focus{outline:none}
.composer:focus-within{box-shadow:0 0 0 4px rgba(124,77,255,.18),0 24px 60px -24px var(--shadow)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8A63FF;outline-offset:2px}
.search{border:1px solid var(--field-brd);background:var(--field);color:var(--ink)}
.search:focus{outline:none;border-color:rgba(138,99,255,.55)}
.model-toolbar{display:flex;align-items:center;gap:6px;min-height:40px;position:relative}
.model-toolbar .search-wrap{position:relative;flex:0 0 40px;min-width:40px;transition:flex-basis .28s cubic-bezier(.4,.1,.2,1),flex-grow .28s cubic-bezier(.4,.1,.2,1),min-width .28s ease;z-index:2}
.model-toolbar.search-on .search-wrap{flex:1 1 auto;min-width:0}
.model-toolbar .search-wrap .search{width:100%;box-sizing:border-box;height:40px;padding:0 10px 0 36px;border-radius:12px;font-family:'Onest',sans-serif;font-size:14px;transition:padding .2s ease}
.model-toolbar:not(.search-on) .search-wrap .search{padding:0;border-color:transparent;background:var(--seg-bg);color:transparent;caret-color:transparent;cursor:pointer}
.model-toolbar:not(.search-on) .search-wrap .search::placeholder{color:transparent}
.model-toolbar:not(.search-on) .search-wrap .search::-webkit-search-cancel-button{display:none}
.model-toolbar.search-on .search-wrap .search{background:var(--seg-bg);border-color:transparent}
.model-toolbar .search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--accent-ink);pointer-events:none;z-index:1}
.model-toolbar #tabs{flex:1 1 auto;min-width:0;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--seg-bg);overflow:hidden;transition:opacity .2s ease,flex-basis .28s ease,max-width .28s ease,padding .2s ease}
.model-toolbar.search-on #tabs{flex:0 0 0;max-width:0;opacity:0;padding-left:0;padding-right:0;pointer-events:none}
.sort-btn{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:none;background:var(--seg-bg);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sort-btn:hover{background:var(--soft-hover);color:var(--ink)}
.model{border-radius:14px!important;padding:9px 11px!important;gap:8px!important}
.model .m-name{font-size:13px!important;font-weight:700}
.model .m-kind{font-size:11px!important}
.model .m-price{font-size:13px!important;font-weight:700}
.model .m-unit{font-size:10px!important}
.ttl{scrollbar-width:thin}
.ttl{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);padding-bottom:18px!important}
.cabinet{border-radius:16px;background:var(--card-on);border:1px solid var(--glass-brd);box-shadow:0 8px 20px -16px var(--shadow);overflow:hidden;flex:0 0 auto}
.cab-row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:56px;box-sizing:border-box}
.cab-link{text-decoration:none;color:var(--ink)}
.cab-link:hover{background:var(--soft)}
.cab-tile{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cab-end{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted2)}


.t-light{--user-bg:#1E1238;--user-ink:#FFFFFF;--purple:#5B35E0;--purple2:#7A55FF;--purple-soft:rgba(91,53,224,.1);--purple-soft-h:rgba(91,53,224,.17);--purple-brd:rgba(91,53,224,.18);--purple-ink:#4A2CC0}
.t-dark{--user-bg:#EDE8FF;--user-ink:#1E1238;--purple:#7A55FF;--purple2:#9B7BFF;--purple-soft:rgba(155,123,255,.14);--purple-soft-h:rgba(155,123,255,.22);--purple-brd:rgba(155,123,255,.25);--purple-ink:#D2C4FF}
.btn-purple{border:1px solid var(--purple-brd);background:var(--purple-soft);color:var(--purple-ink);font-family:'Onest',sans-serif;font-weight:700;cursor:pointer}
.btn-purple:hover{background:var(--purple-soft-h)}
.btn-login{border:none;background:#6758A0;color:#FFFFFF;font-family:'Onest',sans-serif;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -12px rgba(103,88,160,.7)}
.btn-login:hover{background:#5C4E93}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(14px);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{color:var(--ink)}
.icon-on{color:var(--ink);background:var(--nav-on)}
.icon-ghost{width:36px;height:36px;border-radius:10px;border:none;background:transparent;backdrop-filter:none;color:var(--muted)}
.icon-ghost:hover{background:var(--soft)}
.eye-p{position:absolute;width:8.5%;height:27%;top:34.5%;transition:transform .28s cubic-bezier(.3,.7,.4,1)}
.eye-p.l{left:34.25%}.eye-p.r{left:57.25%}
.hero{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 24px;text-align:center;overflow:hidden;transition:flex-grow .55s cubic-bezier(.4,.1,.2,1),opacity .4s ease,transform .55s cubic-bezier(.4,.1,.2,1),padding .55s ease,max-height .55s ease;max-height:900px}
.hero-off{flex-grow:0;opacity:0;transform:scale(.22) translateY(-60%);padding:0;max-height:0;pointer-events:none}
@keyframes avLand{0%{transform:translate(160px,-220px) scale(3.6);opacity:.2}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes msgIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.av-land{animation:avLand .7s cubic-bezier(.3,.7,.3,1) both}
.msg-in{animation:msgIn .35s ease-out both}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dots 1.1s ease-in-out infinite}
.panel{transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){.orb-float,.caret,.av-land,.msg-in,.dot,.modal-ov,.modal-card,.modal-egg,.shake{animation:none}.hero{transition:none}}

.hidden{display:none!important}
.modal-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--ov);backdrop-filter:blur(8px);animation:ovIn .25s ease-out both}
.t-light{--ov:rgba(40,24,90,.22)}.t-dark{--ov:rgba(4,2,12,.6)}
@keyframes ovIn{0%{opacity:0}100%{opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes eggPop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}70%{transform:translate(-50%,-4px) scale(1.06);opacity:1}100%{transform:translate(-50%,0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modal-card{position:relative;width:100%;max-width:420px;box-sizing:border-box;border-radius:28px;padding:56px 28px 24px;background:var(--modal-bg);border:1px solid var(--glass-brd);backdrop-filter:blur(24px);box-shadow:0 40px 90px -30px var(--shadow);animation:cardIn .35s cubic-bezier(.3,.7,.3,1) both}
.t-light{--modal-bg:rgba(255,255,255,.86)}.t-dark{--modal-bg:rgba(28,22,46,.9)}
.modal-egg{position:absolute;left:50%;top:-40px;width:80px;height:80px;transform:translateX(-50%);animation:eggPop .55s .1s cubic-bezier(.3,.7,.3,1) both}
.fld{display:flex;flex-direction:column;gap:6px}
.fld-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld-in{height:50px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--field);padding:0 16px;font-family:'Onest',sans-serif;font-size:16px;color:var(--ink);box-sizing:border-box;width:100%;transition:border-color .15s ease,box-shadow .15s ease}
.fld-in::placeholder{color:var(--muted2)}
.fld-in:focus{outline:none;border-color:var(--purple2);box-shadow:0 0 0 4px rgba(122,85,255,.16)}
.fld-err .fld-in{border-color:#E0457B}
.btn-primary{height:50px;border-radius:14px;border:none;width:100%;background:linear-gradient(135deg,var(--purple2),var(--purple));color:#FFFFFF;font-family:'Onest',sans-serif;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 26px -14px rgba(91,53,224,.85)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.link-btn{border:none;background:none;padding:0;font-family:'Onest',sans-serif;font-size:14px;font-weight:600;color:var(--accent-ink);cursor:pointer;min-height:32px}
.link-btn:hover{text-decoration:underline}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--purple);flex:0 0 auto;cursor:pointer}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp-cell{height:56px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--field);display:flex;align-items:center;justify-content:center;font-family:'Days One',sans-serif;font-size:22px;color:var(--ink)}
.otp-on{border-color:var(--purple2);box-shadow:0 0 0 4px rgba(122,85,255,.16)}
.otp-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;font-size:16px;cursor:text}
.shake{animation:shake .3s ease}
.x-btn{position:absolute;right:14px;top:14px}
.otp-err{border-color:#E0457B}
.otp-lock{opacity:.45}
.err-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(224,69,123,.1);border:1px solid rgba(224,69,123,.28);color:#C2305F;font-size:13px;line-height:1.45}
.t-dark .err-banner{color:#FF8DB3;background:rgba(255,120,170,.1);border-color:rgba(255,120,170,.3)}
.t-dark [role=alert]{color:#FF8DB3!important}
.soc{display:flex;flex-direction:column;gap:8px}
.soc-btn{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--field-brd);background:var(--card-on);color:var(--ink);font-family:'Onest',sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.soc-btn:hover{border-color:var(--purple2);transform:translateY(-1px)}
.soc-btn[disabled]{opacity:.55;cursor:progress;transform:none}
.or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--field-brd)}
.chk-err{color:#D63B6F}
.soc-logo{width:20px;height:20px;display:block}
.soc-fb{display:none}
.soc-btn:not(:has(.soc-logo)) .soc-fb{display:flex}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="root" class="page-bg t-light bg-light" style="min-height:100vh;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:16px;padding:16px;font-family:'Onest',system-ui,sans-serif">

  <aside id="left" class="glass panel" style="flex:1 1 260px;max-width:280px;min-width:240px;box-sizing:border-box;border-radius:28px;padding:18px 12px 14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 32px);overflow:hidden;box-shadow:0 20px 50px -30px var(--shadow)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:10px">
      <a href="/" aria-label="{AI}-шница — на главную" style="text-decoration:none;font-family:'Days One',sans-serif;font-size:15px;color:var(--ink)"><span style="color:#E8691C">{AI}</span>-шница</a>
      <span style="display:flex;align-items:center;gap:2px"><a href="#" class="icon-btn icon-ghost" aria-label="Помощь" title="Помощь"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"></path></svg></a><button type="button" id="themeBtn" class="icon-btn icon-ghost" aria-label="Тёмная тема" title="Тёмная тема"></button><button type="button" class="icon-btn icon-ghost" aria-label="Скрыть панель" data-toggle-left><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button></span>
    </div>
    <nav aria-label="Разделы" style="display:flex;flex-direction:column;gap:4px">
      <a href="/explore" class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>Витрина</a>
      <a href="/settings" class="nav-item" id="cabinetNav" data-cabinet><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="8" r="3.5"></circle></svg>Личный кабинет</a>
    </nav>
    <div style="height:1px;background:var(--field-brd);margin:2px 4px 4px"></div>
    <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px">
      <div id="modelToolbar" class="model-toolbar">
        <label class="search-wrap" for="query">
          <span class="sr-only">Поиск модели</span>
          <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="query" class="search" type="search" placeholder="Поиск модели" autocomplete="off">
        </label>
        <div id="tabs" role="tablist" aria-label="Тип модели"></div>
        <button type="button" id="sortBtn" class="sort-btn" aria-label="Сортировка: сначала дешёвые" title="Сначала дешёвые">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h7M4 17h4M16 10l3-3 3 3M19 7v10"></path></svg>
        </button>
        <select id="sort" class="sr-only" tabindex="-1" aria-hidden="true">
          <option value="cheap">Сначала дешёвые</option>
          <option value="pricey">Сначала дорогие</option>
          <option value="name">По названию</option>
        </select>
      </div>
      <div class="ttl" style="flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -2px;padding:2px 2px 4px">
        <div id="models" style="display:flex;flex-direction:column;gap:6px"></div>
        <div id="empty" class="hidden" style="padding:24px 8px;text-align:center;font-size:14px;color:var(--muted)">Ничего не нашлось. Попробуйте другое слово.</div>
      </div>
    </div>
  </aside>

  <main style="flex:999 1 520px;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;height:calc(100vh - 32px);min-height:560px">
    <div style="display:flex;align-items:center;gap:8px;padding:0 4px;min-height:44px">
      <span id="leftReopen" class="hidden" style="display:flex;align-items:center;gap:6px">
        <button type="button" class="icon-btn" aria-label="Показать панель" data-toggle-left><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button>
        <a href="/" style="margin-left:6px;text-decoration:none;font-family:'Days One',sans-serif;font-size:14px;color:var(--ink)"><span style="color:#E8691C">{AI}</span>-шница</a>
      </span>
    </div>

    <div id="hero" class="hero">
      <div style="position:relative;width:132px;height:132px;margin-bottom:18px">
        <div id="halo" style="position:absolute;inset:-40%;border-radius:50%"></div>
        <div class="orb-float" style="position:relative;width:100%;height:100%">
          <img src="assets/orb-no-eyes.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
          <span class="eye-p l hero-eye"><span class="eye-shape"></span></span>
          <span class="eye-p r hero-eye"><span class="eye-shape"></span></span>
        </div>
      </div>
      <div class="glass" style="position:relative;border-radius:22px;padding:13px 22px 14px;box-shadow:0 16px 40px -20px var(--shadow);max-width:calc(100% - 8px);box-sizing:border-box">
        <span aria-hidden="true" style="position:absolute;left:50%;top:-8px;width:14px;height:14px;margin-left:-7px;background:var(--bubble-tail);border-left:1px solid var(--glass-brd);border-top:1px solid var(--glass-brd);transform:rotate(45deg);border-radius:3px 0 0 0"></span>

async function ensureCsrf() {
  if (window.__csrfToken) return window.__csrfToken;
  const m = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
  if (m) { window.__csrfToken = decodeURIComponent(m[1]); return window.__csrfToken; }
  const res = await fetch('/api/csrf', { credentials: 'same-origin' });
  const data = await res.json().catch(() => ({}));
  window.__csrfToken = data.csrf_token || '';
  return window.__csrfToken;
}
async function api(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = await ensureCsrf();
  const res = await fetch(path, { credentials: 'same-origin', ...options, headers });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  return { res, data };
}

      $('mPwToggle').textContent = v.pwToggleLabel;
      document.querySelectorAll('[data-soc]').forEach((b, i) => { const o = v.socials[i]; if (!o) return; b.disabled = o.busy; const lab = b.querySelector('span:last-child'); if (lab) lab.textContent = o.label; });
      $('mChk').classList.toggle('chk-err', v.chkCls === 'chk-err');
      const cells = document.querySelectorAll('#otp .otp-cell');
      v.cells.forEach((c, i) => { if (cells[i]) { cells[i].textContent = c.d; cells[i].className = 'otp-cell ' + c.cls; } });
      $('otp').classList.toggle('shake', v.shakeCls === 'shake');
      if ($('mCode').value !== v.code) $('mCode').value = v.code;
      $('mCodeBtn').textContent = v.codeBtn; $('mCodeBtn').disabled = v.codeDisabled;
      $('mResend').classList.toggle('hidden', !v.canResend);
      $('mWait').textContent = v.waitResend ? ('Снова через ' + v.resendTxt) : '';
    }
    if (v.modalOpen !== lastModal) {
      lastModal = v.modalOpen;
      if (v.modalOpen) setTimeout(() => (v.stepCode ? $('mCode') : $('mEmail')).focus(), 60);
    }
    if (v.stepCode !== lastStepCode) { lastStepCode = v.stepCode; if (v.stepCode) setTimeout(() => $('mCode').focus(), 60); }
  }

  if ($('sort').value !== v.sort) $('sort').value = v.sort;
}

function msgEl(m) {
  const el = document.createElement('div');
  if (m.user) {
    el.className = 'msg-in';
    el.style.cssText = 'align-self:flex-end;max-width:78%;padding:12px 16px;border-radius:20px 20px 6px 20px;background:var(--user-bg);color:var(--user-ink);font-size:15px;line-height:1.45;white-space:pre-wrap';
    el.textContent = m.text; return el;
  }
  el.className = 'msg-in'; el.style.cssText = 'display:flex;align-items:flex-end;gap:10px;max-width:86%';
  let media = '';
  if (m.result) {
    if (m.mediaUrl) {
      if (m.mediaKind === 'video') media = '<video src="' + esc(m.mediaUrl) + '" controls playsinline style="width:260px;max-width:100%;border-radius:16px;background:#000"></video>';
      else if (m.mediaKind === 'audio' || m.mediaKind === 'music') media = '<audio src="' + esc(m.mediaUrl) + '" controls style="width:260px;max-width:100%"></audio>';
      else media = '<a href="' + (m.workId ? ('/w/' + esc(m.workId)) : esc(m.mediaUrl)) + '" target="_blank" rel="noopener"><img src="' + esc(m.mediaUrl) + '" alt="" style="width:260px;max-width:100%;border-radius:16px;display:block"></a>';
    } else {
      media = '<div style="width:260px;max-width:100%;aspect-ratio:4/3;border-radius:16px;border:1.5px dashed var(--field-brd);background:var(--field);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted2)">здесь будет результат</div>';
    }
  }
  el.innerHTML = '<span class="bot-av ' + m.avCls + '" style="position:relative;flex:0 0 auto;width:38px;height:38px"><img src="' + ORB_SRC + '" alt="{AI}-шница" style="position:absolute;inset:0;width:100%;height:100%;display:block"><span class="eye-p l bot-eye"><span class="eye-shape" style="box-shadow:none"></span></span><span class="eye-p r bot-eye"><span class="eye-shape" style="box-shadow:none"></span></span></span>'
    + '<div class="glass" style="border-radius:20px 20px 20px 6px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;box-shadow:0 12px 30px -20px var(--shadow)"><span style="font-size:15px;line-height:1.45;color:var(--ink)">' + esc(m.text) + '</span>'
    + media
    + (m.loginCta ? '<button type="button" class="btn-login" data-cta data-login style="height:40px;padding:0 18px;border-radius:12px;font-size:14px">Войти и запустить</button>' : '')
    + (m.topup ? '<a href="/balance" class="btn-purple" style="height:40px;padding:0 18px;border-radius:12px;font-size:14px;display:inline-flex;align-items:center;text-decoration:none">К балансу</a>' : '')
    + '</div>';
  return el;
}

/* события */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-home],[data-login],[data-logout],[data-toggle-left],[data-toggle-right],[data-toggle-right-open],[data-works],[data-cabinet]');
  if (!t) return;
  if (t.hasAttribute('data-home')) app.goHome(e);
  else if (t.hasAttribute('data-login')) app.login();
  else if (t.hasAttribute('data-logout')) app.logout();
  else if (t.hasAttribute('data-toggle-left')) app.toggleLeft();
  else if (t.hasAttribute('data-toggle-right')) app.toggleRight();
  else if (t.hasAttribute('data-toggle-right-open')) app.openPanel();
  else if (t.hasAttribute('data-works')) { e.preventDefault(); app.showWorks(); }
  else if (t.hasAttribute('data-cabinet')) {
    if (!app.state.authed) { e.preventDefault(); app.login(); }
  }
});
$('themeBtn').addEventListener('click', () => app.toggleTheme());
$('prompt').addEventListener('input', (e) => app.onType(e));
$('prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); app.onSubmit(e); } });
$('form').addEventListener('submit', (e) => app.onSubmit(e));
$('query').addEventListener('input', (e) => app.onQuery(e));
$('query').addEventListener('focus', () => app.setState({ searchFocus: true }));
$('query').addEventListener('blur', () => {
  if (!(app.state.query || '').trim()) app.setState({ searchFocus: false });
});
$('sortBtn').addEventListener('click', () => app.cycleSort());
$('sort').addEventListener('change', (e) => app.onSort(e));


async function refreshUser() {
  const { data } = await api('/api/auth/me');
  const user = data.user || null;
  const bal = data.available_kop != null ? data.available_kop : (data.balance_kop != null ? data.balance_kop : 0);
  if (user) {
    const name = user.name || user.email || 'Вы';
    app.setState({
      authed: true,
      userName: name,
      userLetter: String(name).slice(0, 1).toUpperCase(),
      balanceText: 'Баланс: ' + formatBalance(bal)
    });
  } else {
    app.setState({ authed: false, userName: '', userLetter: '?', balanceText: 'Баланс: 0 ₽' });
  }
}

async function syncPricing() {
  try {
    const { data } = await api('/api/pricing');
    const byKey = {};
    (data.items || []).forEach((it) => { byKey[it.model_key] = it; });
    app.MODELS = app.MODELS.map((m) => {
      const it = byKey[m.model_key];
      if (!it) return m;
      const rub = Number(it.price_rub) || 0;
      if (it.is_free || rub === 0) {
        return Object.assign({}, m, { cost: 0, price: 'Бесплатно', unit: 'промо', short: 'бесплатно', est: '0 ₽' });
      }
      if (it.unit === 'per_second') {
        const five = Number(it.example_rub_5s) || rub * 5;
        return Object.assign({}, m, { cost: five, price: rub + ' ₽/с', unit: '5 с — ' + five + ' ₽', short: rub + ' ₽/с', est: five + ' ₽ за 5 с' });
      }
      const unit = m.type === 'image' ? 'за картинку' : 'за запуск';
      return Object.assign({}, m, { cost: rub, price: rubLabel(rub), unit: unit, short: rubLabel(rub), est: rubLabel(rub) });
    });
    lastModelsKey = '';
    scheduleRender();
  } catch (_) {}
}



$('modal').addEventListener('click', (e) => { if (e.target === $('modal') || e.target.closest('[data-close]')) app.closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && app.state.modal) app.closeModal(); });
$('mEmail').addEventListener('input', (e) => app.onEmail(e));
$('mPw').addEventListener('input', (e) => app.onPassword(e));
$('mConsent').addEventListener('change', (e) => app.onConsent(e));
$('mPwToggle').addEventListener('click', () => app.togglePw());
document.querySelectorAll('[data-soc]').forEach((b, i) => b.addEventListener('click', () => { const s = app.renderVals().socials[i]; if (s) s.go(); }));
$('stepEmail').addEventListener('submit', (e) => app.submitEmail(e));
$('mCode').addEventListener('input', (e) => app.onCode(e));
$('mCodeBtn').addEventListener('click', () => app.submitCode());
$('mBack').addEventListener('click', () => app.backToEmail());
$('mForgot').addEventListener('click', (e) => app.forgot(e));
$('mPwCode').addEventListener('click', (e) => app.forgot(e));
$('mResend').addEventListener('click', () => app.resend());

app.init();
render();
app.componentDidMount();
refreshUser();
syncPricing();

</script>
</body>
