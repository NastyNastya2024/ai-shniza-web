<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Личный кабинет — {AI}-шница</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=q||localStorage.getItem('aish-vitrina-theme')||localStorage.getItem('aish-theme')||localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
/* ================= токены ================= */
:root{--bg:#EEEAF8;--panel:rgba(255,255,255,.78);--panel-solid:#fff;--brd:rgba(255,255,255,.95);--line:rgba(80,60,160,.12);--line2:rgba(80,60,160,.2);
  --ink:#1E1238;--muted:#5B4D93;--muted2:#8A80B5;--card:#F4F1FC;--card2:#ECE7FA;--field:#fff;
  --violet:#5B35E0;--violet2:#7A55FF;--violet-ink:#4A2CC0;--violet-bg:rgba(91,53,224,.08);--orange:#E8691C;--ok:#16794C;--ok-bg:rgba(22,121,76,.1);--err:#C2305F;
  --shadow:rgba(75,43,184,.22);--bubble-me:#1E1238;--bubble-me-ink:#fff;--bubble:#fff;--page:url(/assets/bg-light.jpg);--hdr:73px;--prof-h:176px;color-scheme:light}
:root[data-theme=dark]{--bg:#15122A;--panel:rgba(44,37,74,.86);--panel-solid:#2A2346;--brd:rgba(255,255,255,.13);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --ink:#F6F3FF;--muted:#C9C0EE;--muted2:#A79DD6;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.11);--field:rgba(255,255,255,.08);
  --violet:#7A55FF;--violet2:#9B7BFF;--violet-ink:#D4C8FF;--violet-bg:rgba(155,123,255,.14);--orange:#FF9A3D;--ok:#7BE3B0;--ok-bg:rgba(123,227,176,.12);--err:#FF8DB3;
  --shadow:rgba(0,0,0,.6);--bubble-me:#EDE8FF;--bubble-me-ink:#1E1238;--bubble:#2A2346;--page:url(/assets/bg-dark.jpg);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg) var(--page) center/cover fixed;color:var(--ink);font-family:'Onest',system-ui,sans-serif;font-size:15px}
:root[data-theme=dark] body{box-shadow:inset 0 0 0 100vmax rgba(70,48,150,.12)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--violet-ink)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.glass{background:var(--panel);border:1px solid var(--brd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:26px;box-shadow:0 24px 60px -40px var(--shadow)}
:root[data-theme=dark] .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 24px 60px -36px rgba(0,0,0,.8)}
.btn{height:44px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--violet2),var(--violet));color:#fff;box-shadow:0 12px 26px -14px rgba(91,53,224,.7)}
.btn-p:hover{filter:brightness(1.06)}
.btn-s{background:var(--field);border-color:var(--line2);color:var(--ink)}
.btn-s:hover{border-color:var(--violet2)}
.btn-g{background:transparent;color:var(--violet-ink)}
.btn-gen{background:radial-gradient(90% 130% at 12% 0%,rgba(255,214,110,.95),rgba(255,214,110,0) 55%),linear-gradient(110deg,#FFA235,#FF7B2C 42%,#FF8F7E 74%,#F6AACF);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line2);background:var(--field);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:0 0 auto}
.ib:hover{border-color:var(--violet2)}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--field);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#1E1238}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#FF8A2B;color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
input.inp,textarea.inp,select.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line2);background:var(--field);padding:12px 14px;font-size:15px}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.inp:focus{outline:none;border-color:var(--violet2);box-shadow:0 0 0 4px rgba(122,85,255,.18)}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.hint{font-size:12.5px;color:var(--muted2);margin-top:6px}

/* ================= шапка ================= */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,32px);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top .logo img{height:40px;display:block}
.nav{display:flex;gap:4px;margin-left:18px}
.nav a{height:40px;padding:0 14px;border-radius:999px;display:flex;align-items:center;text-decoration:none;color:var(--muted);font-weight:700}
.nav a[aria-current]{background:var(--panel-solid);color:var(--ink);box-shadow:0 6px 16px -10px var(--shadow)}
.top .sp{flex:1}
.ava{flex:0 0 auto;aspect-ratio:1;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF9A3D,#F05A7E);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.prof-top{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;align-items:stretch;margin:18px 0 22px;width:100%}
.ph-identity{display:flex;flex-direction:column;gap:12px;min-width:0}
.ph-about{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.ph-about .inp{flex:1;min-height:118px;resize:vertical;line-height:1.45;width:100%;box-sizing:border-box}
.phbtns{display:flex;gap:8px;flex-wrap:wrap}
.crop-bg{position:fixed;inset:0;z-index:80;background:rgba(20,12,40,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.crop-bg[hidden]{display:none}
.crop{width:min(420px,100%);padding:18px;background:var(--panel-solid)}
.crop-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.crop-h b{font-size:17px}
.crop-stage{position:relative;width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#111;touch-action:none;cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage canvas{width:100%;height:100%;display:block}
.crop-ring{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle closest-side at center,transparent calc(100% - 12px),rgba(10,6,24,.55) calc(100% - 11px))}
.crop-ring::after{content:"";position:absolute;inset:12px;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.crop-zoom{display:flex;align-items:center;gap:10px;margin:6px 4px 14px;font-weight:800;color:var(--muted)}
.crop-zoom input{flex:1;accent-color:var(--violet)}
.crop-f{display:flex;gap:8px;align-items:center}.crop-f .sp{flex:1}
@media (max-width:640px){.crop-bg{align-items:flex-end;padding:0}.crop{border-radius:26px 26px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom))}.crop-f [data-crop=other]{padding:0 12px}}
.ava.ava-e{background:var(--card2);color:var(--muted2)}

/* ================= раскладка (как публичный профиль) ================= */
.wrap{max-width:1320px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 80px;display:flex;flex-direction:column;box-sizing:border-box}
.main{min-width:0;flex:1 1 auto}
html{scrollbar-gutter:stable}

/* профиль — одна высота на всех вкладках, чтобы табы не прыгали */
.prof{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:20px 36px;padding:20px 28px;margin:0;flex:0 0 auto;height:var(--prof-h);min-height:var(--prof-h);max-height:var(--prof-h);overflow:hidden;box-sizing:border-box}
.prof-row{display:flex;flex-wrap:nowrap;gap:20px 36px;align-items:center;min-width:0;flex:1 1 auto}
.prof .ava{width:88px;height:88px;font-size:34px;box-shadow:0 0 0 4px var(--panel-solid),0 14px 28px -12px rgba(232,105,28,.45)}
.avabtn{position:relative;display:block;flex:0 0 auto;width:88px;height:88px;border:none;padding:0;background:none;cursor:pointer;border-radius:50%;line-height:0;overflow:visible;z-index:1}
.avabtn .ava{width:100%!important;height:100%!important;font-size:inherit!important;pointer-events:none}
.avabtn .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--panel-solid);font-size:11px;z-index:2;box-sizing:border-box;line-height:0;pointer-events:none}
.p-main{flex:1 1 auto;min-width:0}
.prof h1,.p-name{margin:0;font-weight:800;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.03em;line-height:1.12}
.prof .nick{color:var(--muted2);font-weight:700;font-size:14px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof .about{margin:10px 0 0;max-width:640px;line-height:1.4;color:var(--muted);font-size:14px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prof .ph{color:var(--muted2);font-style:italic}
.pcs{display:none}
.stats{display:flex;gap:24px 28px;margin-top:14px;flex-wrap:wrap}
.stats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stats span{font-size:12.5px;color:var(--muted2);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.stats .heart{color:#E0457B;flex:0 0 auto}
.p-side{display:flex;flex-direction:column;gap:10px;flex:0 0 240px;width:240px;max-width:240px;align-self:center;margin-left:auto;padding-left:8px}
.p-side .btn{height:42px;padding:0 16px;font-size:14px;width:100%;box-sizing:border-box}
.p-side .btn-logout{height:38px;font-size:13.5px;font-weight:700;color:var(--ink);border:1.5px solid var(--line2);background:var(--field);gap:8px}
.p-side .btn-logout svg{flex:0 0 auto;opacity:.85}
.p-side .btn-logout:hover{color:var(--err);border-color:rgba(194,48,95,.35)}
.p-side .btn-logout:hover svg{opacity:1}
.p-side .btn-gen{white-space:nowrap}
.p-side .btn-g{width:auto;height:auto;padding:0;justify-content:flex-start;font-size:13px}
.p-side .hint-side{margin:0;font-size:12px;line-height:1.35;color:var(--muted2);font-weight:600;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* вкладки — в рамке, как раньше */
.tabs{display:flex;gap:4px;padding:5px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;margin:14px 0 18px;background:var(--panel);border:1px solid var(--brd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 60px -40px var(--shadow);box-sizing:border-box;flex:0 0 auto}
.tabs.glass{border-radius:999px}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.tab{height:40px;padding:0 16px;border-radius:999px;border:none;background:transparent;font-weight:800;font-size:14.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto}
.tabs button:hover,.tab:hover{color:var(--ink)}
.tabs button[aria-selected=true],.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
:root[data-theme=dark] .tabs button[aria-selected=true],:root[data-theme=dark] .tab[aria-selected=true]{color:#1E1238}
.tabs .tab-ico{display:inline-flex;flex:0 0 auto;opacity:.9}
.tabs .tab-ico svg{display:block}
.tabs .tab-lbl{display:inline}
.tabs .tab-bal{font-weight:800;opacity:.85}
.tabs .badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#FF8A2B;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.tabs button[aria-selected=true] .badge{background:#fff;color:var(--ink)}
:root[data-theme=dark] .tabs button[aria-selected=true] .badge{background:#1E1238;color:#fff}

@media (min-width:901px){
  .tabs{gap:14px;padding:8px 12px;margin:16px 0 20px}
  .tabs button,.tab{padding:0 22px;gap:9px}
}

/* работы */
.grid{columns:3;column-gap:14px}
.wk{break-inside:avoid;margin:0 0 14px;padding:5px;border-radius:22px;background:var(--panel-solid);box-shadow:0 14px 30px -24px var(--shadow);position:relative}
.wk img{display:block;width:100%;border-radius:17px}
.wk .st{position:absolute;left:14px;bottom:14px;height:28px;padding:0 12px;border-radius:999px;border:none;background:rgba(255,255,255,.95);color:#16794C;font:800 12px inherit;display:inline-flex;align-items:center;gap:6px;cursor:pointer;z-index:2;box-shadow:0 6px 16px -10px rgba(20,12,40,.35)}
.wk .st:hover{filter:brightness(1.05);transform:translateY(-1px)}
.wk .st.h{background:rgba(30,18,56,.78);color:#E6E0FA}
.wk .st:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.wk .st[disabled]{opacity:.6;cursor:wait;transform:none}
.wk .wk-exp{position:absolute;right:14px;top:14px;height:24px;padding:0 10px;border-radius:999px;background:rgba(30,18,56,.78);color:#FFE0B8;font:700 11.5px inherit;display:inline-flex;align-items:center;z-index:2}
.wk-ttl-note{margin:0 0 14px;padding:10px 14px;border-radius:14px;background:rgba(255,162,53,.12);font-size:13.5px;line-height:1.45;color:var(--ink)}
.empty{padding:44px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ill{width:96px;height:96px;border-radius:28px;background:var(--card);display:flex;align-items:center;justify-content:center}
.empty h3{margin:4px 0 0;font-size:20px;font-weight:800}
.empty p{margin:0;max-width:440px;color:var(--muted);line-height:1.55}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ================= сообщения ================= */
.msgs{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:320px;height:auto;max-height:min(520px,calc(100dvh - var(--hdr, 73px) - var(--prof-h) - 88px));overflow:hidden;padding:0}
.ml{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ml-h{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.ml-f{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ml-list{flex:1;overflow-y:auto}
.cv{display:flex;gap:11px;width:100%;padding:12px 14px;border:none;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);position:relative}
.cv:hover{background:var(--card)}
.cv[aria-current=true]{background:var(--violet-bg)}
.cv .ava{width:42px;height:42px;font-size:16px}
.cv .b{flex:1;min-width:0}
.cv .r1{display:flex;align-items:center;gap:6px}
.cv .n{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .t{margin-left:auto;font-size:12px;color:var(--muted2);flex:0 0 auto}
.cv .k{display:inline-flex;margin-top:3px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--violet-ink)}
.cv .k.o{background:rgba(255,138,43,.14);color:var(--orange)}
.cv .k.c{background:var(--ok-bg);color:var(--ok)}
.cv .p{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.ava.ava-orb{background:transparent!important;box-shadow:none!important;padding:0}
.ava.ava-orb img{width:100%;height:100%;object-fit:contain;display:block}
.cv.unread .n:after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF8A2B;margin-left:6px;vertical-align:2px}
.th{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.th-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.th-h .ava{width:40px;height:40px;font-size:15px}
.th-h b{display:block;font-size:15.5px}.th-h span{font-size:12.5px;color:var(--muted2);font-weight:700}
.th-h .sp{flex:1}
.th-who{min-width:0}.th-who b,.th-who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}
.ref{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);flex:0 0 auto}
.ref img{width:54px;height:54px;border-radius:12px;object-fit:cover}
.ref b{display:block;font-size:14px}.ref span{font-size:12.5px;color:var(--muted)}
.feed>*{flex-shrink:0}
.feed{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:10px;background-color:#FAF7FF;background-image:url(/assets/chat-pattern-light.svg);background-size:480px 480px;background-repeat:repeat}
:root[data-theme=dark] .feed{background-color:#0F0B16;background-image:url(/assets/chat-pattern-dark.svg)}
.feed-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;padding-top:4px}
.feed-chips .chip{height:32px;padding:0 12px;font-size:12.5px;background:rgba(255,255,255,.88);border-color:var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
:root[data-theme=dark] .feed-chips .chip{background:rgba(42,35,70,.88)}
.day{align-self:center;font-size:12px;font-weight:700;color:var(--muted2);padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-theme=dark] .day{background:rgba(42,35,70,.72)}
.sys{align-self:center;max-width:86%;text-align:center;font-size:13px;color:var(--muted);line-height:1.45;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-theme=dark] .sys{background:rgba(42,35,70,.62)}
.bb{max-width:72%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--bubble);border:1px solid var(--line);line-height:1.5;font-size:14.5px;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.bb.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-color:transparent;border-radius:18px 18px 6px 18px}
.bb small{display:block;margin-top:4px;font-size:11px;opacity:.6;text-align:right}
.att{display:flex;align-items:center;gap:10px;margin-top:6px;padding:8px 10px;border-radius:12px;background:rgba(127,110,200,.14)}
.att .fi{width:36px;height:36px;border-radius:10px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.att b{display:block;font-size:13px}.att span{font-size:11.5px;opacity:.75}
.promptcard{white-space:normal;overflow-wrap:anywhere;margin-top:6px;padding:10px 12px;border-radius:12px;background:rgba(255,162,53,.14);border:1px dashed rgba(232,105,28,.4);font-size:13.5px}
.promptcard em{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--orange);margin-bottom:4px}
.th-foot{flex:0 0 auto;background:var(--panel-solid);border-top:1px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:2}
.comp{display:block;padding:10px 16px 8px}
.comp-box{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line2);background:var(--field)}
.comp-box:focus-within{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(122,85,255,.12)}
.comp-row{display:flex;align-items:flex-end;gap:8px}
.comp textarea{flex:1;min-height:40px;max-height:140px;border:none;background:transparent;padding:6px 2px;resize:none;font-size:15px;line-height:1.4;color:var(--ink)}
.comp textarea:focus{outline:none}
.comp .comp-send{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--violet);color:#fff;border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.comp .comp-attach{flex:0 0 auto}
.note{font-size:12px;color:var(--muted2);padding:0 16px 8px;text-align:center;margin:0}
.no-th{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:30px}

/* ================= баланс ================= */
.bal{padding:24px}
.bal h2,.sec h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.bal .nums{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0 20px}
.bal .nums b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em}
.bal .nums span{font-size:13px;font-weight:700;color:var(--muted)}
.amts{display:flex;gap:8px;flex-wrap:wrap}
.amt{height:48px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line2);background:var(--field);font-weight:800;font-size:16px;cursor:pointer}
.amt[aria-pressed=true]{border-color:var(--violet2);background:var(--violet-bg);color:var(--violet-ink);box-shadow:0 0 0 3px rgba(122,85,255,.14)}
.amt small{display:block;font-size:11px;font-weight:700;color:var(--ok);margin-top:-2px}
.topup{display:flex;flex-direction:column;gap:10px;margin-top:16px;max-width:320px}
.topup .btn-p{width:100%;height:48px}
.ck2{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px;color:var(--muted);line-height:1.45}
.ck2 input{width:18px;height:18px;accent-color:var(--violet);margin:1px 0 0}
.hist{margin-top:22px;padding:20px 22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted2);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line)}
td.sum{text-align:right;font-weight:800;white-space:nowrap}
th.sum{text-align:right}
.plus{color:var(--ok)}
.tp{display:inline-flex;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card2)}
.tp.in{background:var(--ok-bg);color:var(--ok)}.tp.hold{background:rgba(255,138,43,.14);color:var(--orange)}

/* ================= настройки профиля ================= */
.sec{padding:24px}
.form{display:grid;grid-template-columns:1fr;gap:16px;margin-top:0}
.form .full{grid-column:1/-1}
.form .full.contacts-block{margin-top:10px;padding-top:6px}
.crow{display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr) 110px 40px;gap:8px;align-items:center;margin-bottom:8px}
.crow-net{position:relative;min-width:0}
.crow-net .crow-lbl{width:100%;min-height:40px;font-size:13.5px;font-weight:700;padding-right:34px}
.crow-net-custom select{position:absolute;right:0;top:0;bottom:0;width:36px;opacity:0;cursor:pointer;z-index:2;margin:0;padding:0;border:none;background:transparent}
.crow-net-custom::after{content:'';position:absolute;right:12px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);transform:translateY(-65%) rotate(45deg);pointer-events:none;z-index:1}
.sw{position:relative;width:46px;height:28px;border-radius:999px;border:none;background:var(--line2);cursor:pointer;flex:0 0 auto}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:#16C47F}.sw[aria-checked=true]:after{transform:translateX(18px)}
.vis{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.save{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;transition:.25s;pointer-events:none}
:root[data-theme=dark] .toast{color:#1E1238}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hl{animation:hl 1.4s ease}
@keyframes hl{0%,60%{box-shadow:0 0 0 4px rgba(255,162,53,.5)}100%{box-shadow:none}}
.cv .k.a{background:linear-gradient(110deg,#FFA235,#F2668B);color:#fff;border:none}

/* чат: та же шапка и те же отступы — сжимается только блок сообщений */
body.is-chat{overflow:hidden}
body.is-chat .wrap{height:calc(100dvh - var(--hdr, 73px));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow:hidden}
body.is-chat .main{min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.is-chat .msgs{position:static;flex:1 1 0;min-height:0!important;height:auto!important;max-height:none!important}

/* ================= планшет и телефон ================= */
@media (max-width:1100px){.grid{columns:2}}
@media (max-width:900px){
  .msgs{grid-template-columns:1fr}
  .msgs.open .ml{display:none}.msgs:not(.open) .th{display:none}
  .back{display:inline-flex}
  .prof{flex-direction:column;align-items:stretch;gap:12px;height:auto;min-height:0;max-height:none;overflow:visible;padding:14px 16px}
  .prof-row{flex-direction:column;align-items:center;text-align:center;gap:16px;width:100%}
  .p-main{width:100%;text-align:center}
  .stats{justify-content:center}
  .p-side{flex:0 0 auto;width:100%;max-width:none;margin-left:0;align-self:stretch}

  .prof .about{-webkit-line-clamp:1}
  .p-side .hint-side{-webkit-line-clamp:1}
  .tabs{width:100%;max-width:100%;justify-content:stretch;margin:12px 0 14px}
  .tabs .tab{flex:1 1 0;justify-content:center;padding:0 8px;min-width:0;gap:5px;font-size:13px}
  .tabs .tab-bal{display:none}
}
@media (max-width:480px){
  .tabs .tab{padding:0 6px;gap:0}
  .tabs .tab-lbl{display:none}
}
@media (max-width:640px){
  .nav{display:none}
  .wrap{padding:12px 12px 24px}
  :root{--prof-h:auto}
  .prof{padding:14px 14px 16px;gap:12px;height:auto;min-height:0;max-height:none;overflow:visible}
  .prof-row{flex-direction:column;align-items:center;text-align:center;gap:16px}
  .prof .ava,.avabtn{width:96px;height:96px;font-size:36px}
  .avabtn .cam{width:30px;height:30px;right:-2px;bottom:-2px}
  .p-main{width:100%;text-align:center}
  .prof h1,.p-name{font-size:22px}
  .prof .nick{white-space:normal;overflow:visible;text-overflow:unset}
  .stats{gap:14px 18px;justify-content:center;margin-top:10px}
  .stats b{font-size:18px}
  .stats span{font-size:11.5px;justify-content:center}
  .p-side{max-width:none;align-self:stretch}
  .p-side .btn{height:40px;padding:0 12px;font-size:13.5px}
  .p-side .hint-side{display:none}
  .grid{columns:2;column-gap:10px}
  .prof-top{grid-template-columns:1fr;max-width:none}
  .form{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr 1fr;}
  .crow .vis{grid-column:1}.crow .del{justify-self:end}
  .topup{grid-template-columns:1fr}
  .bb{max-width:86%}
  .feed{background-size:360px 360px}
  .th-h{gap:8px;padding:10px 12px}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid var(--line)}
  td{border:none;padding:2px 0}
  td.sum{grid-row:1/3;grid-column:2;align-self:center}
  .msgs{border-radius:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* «удалится через 5 ч» — неопубликованные генерации хранятся 24 часа */
function expLeft(iso) {
  const ms = Date.parse(iso) - Date.now();
  if (!isFinite(ms)) return '';
  if (ms <= 0) return 'удаляется';
  const h = Math.floor(ms / 3600e3);
  return h >= 1 ? 'удалится через ' + h + ' ч' : 'удалится через ' + Math.max(1, Math.round(ms / 60e3)) + ' мин';
}
function vWorks() {
  if (!D.works.length) return $('view').innerHTML = '<div class="glass empty"><div class="ill">' + I.img + '</div><h3>Здесь появятся ваши работы</h3><p>Создайте первую генерацию в студии и опубликуйте лучшее на витрине — клиенты смогут запросить у вас промпт, оригинал или заказать работу.</p><div class="btns"><a class="btn btn-gen" href="/app">' + I.spark + 'Создать первую работу</a><a class="btn btn-s" href="/explore">Посмотреть витрину</a></div><p class="hint">Совет: Seedance сейчас бесплатно — попробуйте видео со звуком.</p></div>';
  const hasExp = D.works.some((w) => !w.pub && w.exp);
  $('view').innerHTML = (hasExp ? '<p class="wk-ttl-note">Неопубликованные работы хранятся 24 часа, потом удаляются вместе с файлом. Опубликуйте на витрине — и работа останется в профиле.</p>' : '')
    + '<div class="grid">' + D.works.map((w) => '<div class="wk"><img src="' + esc(w.src) + '" alt="' + esc(w.title) + '">' + (!w.pub && w.exp ? '<span class="wk-exp" title="Без публикации работа удалится">' + esc(expLeft(w.exp)) + '</span>' : '') + '<button type="button" class="st' + (w.pub ? '' : ' h') + '" data-pub="' + esc(String(w.id)) + '" aria-pressed="' + (w.pub ? 'true' : 'false') + '" title="' + (w.pub ? 'Скрыть с витрины' : 'Опубликовать на витрине') + '">' + (w.pub ? 'На витрине' : 'Скрыта') + '</button></div>').join('') + '</div>';
}
async function toggleWorkPub(w, btn) {
  if (!w || w._busy) return;
  const next = !w.pub;
  w._busy = true;
  if (btn) btn.disabled = true;
  try {
    if (LIVE) {
      const path = next ? '/api/works/' + encodeURIComponent(w.id) + '/publish' : '/api/works/' + encodeURIComponent(w.id) + '/unpublish';
      const body = next ? JSON.stringify({ agree_rules: true, title: w.title || '' }) : '{}';
      const { res, data } = await api(path, { method: 'POST', body });
      if (!res.ok) {
        if (data && data.error === 'handle_required') {
          toast('Сначала укажите ник в профиле');
          tab = 'settings';
          render();
          return;
        }
        toast(next ? 'Не удалось опубликовать' : 'Не удалось скрыть');
        return;
      }
      w.pub = next;
      if (data && data.work) {
        w.title = data.work.title || w.title;
        w.src = data.work.thumb_url || data.work.media_url || w.src;
      }
    } else {
      w.pub = next;
      saveLocal();
    }
    renderSide();
    if (tab === 'works') vWorks();
    toast(next ? 'Опубликовано на витрине' : 'Скрыто с витрины');
  } finally {
    w._busy = false;
    if (btn) btn.disabled = false;
  }
}

function makeAssistantThread() {
  return {
    id: 'assistant',

    kind: 'assistant',
    work: null,
    status: 'answered',

    ]
  };

function ensureAssistant() {
  D.threads = D.threads || [];
  let t = D.threads.find((x) => x.kind === 'assistant' || x.id === 'assistant' || (x.with && x.with.assistant));
  if (!t) {
    t = makeAssistantThread();
    D.threads.unshift(t);
  } else {
    t.kind = 'assistant';
    if (t.with) t.with.assistant = true;
    D.threads = [t].concat(D.threads.filter((x) => x !== t));
  }
  return t;
}
function openAssistant() {
  const t = ensureAssistant();

function previewLine(s, max) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  if (s.length <= max) return s.endsWith('…') || s.endsWith('...') ? s : s;
  return s.slice(0, max - 1).replace(/\s+\S*$/, '').replace(/[.,;:!?…]+$/, '') + '…';
}

function send(t, msg) {
  if (!t) return;
  t.msgs.push(Object.assign({ from: 'me', ts: Date.now() }, msg));
  saveLocal();
  vMsgs();
  if (t.kind === 'assistant') {
    if (LIVE && String(t.id) !== 'assistant') {
      api('/api/threads/' + encodeURIComponent(t.id) + '/messages', {
        method: 'POST',
        body: JSON.stringify({ text: msg.text || '' }),
      }).then(({ res, data }) => {
        if (res.ok && data.thread) {
          const i = D.threads.findIndex((x) => String(x.id) === String(t.id));
          if (i >= 0) D.threads[i] = data.thread;
          ensureAssistant();
          vMsgs();
        }

const CROP = { img: null, z: 1, x: 0, y: 0, drag: null };

async function csrf(force) {
  if (!force && window.__csrf) return window.__csrf;
  if (!force) {
    const m = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
    if (m) { window.__csrf = decodeURIComponent(m[1]); return window.__csrf; }
  }
  window.__csrf = '';
  const r = await fetch('/api/csrf', { credentials: 'same-origin' });
  window.__csrf = (await r.json().catch(() => ({}))).csrf_token || '';
  return window.__csrf;
}
async function uploadAvatarBlob(blob) {
  const post = async (token) => {
    const fd = new FormData();
    fd.append('file', blob, 'avatar.jpg');
    return fetch('/api/me/avatar', { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF-Token': token }, body: fd });
  };
  let res = await post(await csrf());
  if (res.status === 403) res = await post(await csrf(true));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'upload_failed');
    err.code = data.error || 'upload_failed';
    throw err;
  }
  return data.url;
}

async function setPhoto(src) {

$('avaFile').addEventListener('change', (e) => {

  if (f.size > 10 * 1024 * 1024) return toast('Файл больше 10 МБ — выберите поменьше');
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => { CROP.img = img; CROP.z = 1; CROP.x = 0; CROP.y = 0; $('cropZ').value = 1; $('crop').hidden = false; drawCrop(); setTimeout(() => $('cropZ').focus(), 30); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Не удалось открыть фото — попробуйте JPG или PNG'); };
  img.src = url;
});
function cropGeom(W) {
  const { img, z } = CROP, s = Math.max(W / img.width, W / img.height) * z, w = img.width * s, h = img.height * s;
  const mx = (w - W) / 2, my = (h - W) / 2; CROP.x = Math.max(-mx, Math.min(mx, CROP.x)); CROP.y = Math.max(-my, Math.min(my, CROP.y));
  return { w, h, dx: (W - w) / 2 + CROP.x, dy: (W - h) / 2 + CROP.y };
}
function drawCrop() { const cv = $('cropCv'), c = cv.getContext('2d'), W = cv.width, g = cropGeom(W); c.clearRect(0, 0, W, W); c.drawImage(CROP.img, g.dx, g.dy, g.w, g.h); }
function closeCrop() { $('crop').hidden = true; if (CROP.img) URL.revokeObjectURL(CROP.img.src); CROP.img = null; }
$('cropZ').addEventListener('input', (e) => { CROP.z = +e.target.value; drawCrop(); });
const stage = $('cropStage');
stage.addEventListener('pointerdown', (e) => { stage.setPointerCapture(e.pointerId); CROP.drag = { x: e.clientX, y: e.clientY }; });
stage.addEventListener('pointermove', (e) => { if (!CROP.drag) return; const k = $('cropCv').width / stage.clientWidth; CROP.x += (e.clientX - CROP.drag.x) * k; CROP.y += (e.clientY - CROP.drag.y) * k; CROP.drag = { x: e.clientX, y: e.clientY }; drawCrop(); });
['pointerup', 'pointercancel'].forEach((ev) => stage.addEventListener(ev, () => { CROP.drag = null; }));
stage.addEventListener('wheel', (e) => { e.preventDefault(); CROP.z = Math.max(1, Math.min(3, CROP.z - e.deltaY * 0.002)); $('cropZ').value = CROP.z; drawCrop(); }, { passive: false });
$('crop').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-crop]'); if (e.target === $('crop')) return closeCrop(); if (!b) return;
  if (b.dataset.crop === 'cancel') return closeCrop();
  if (b.dataset.crop === 'other') { closeCrop(); return pickPhoto(); }
  if (b.dataset.crop !== 'ok') return;
  const src = $('cropCv'), S = src.width;
  const stageW = Math.max(1, stage.clientWidth || S);
  const inset = Math.max(0, 12 * S / stageW);
  const out = document.createElement('canvas'); out.width = out.height = 400;
  out.getContext('2d').drawImage(src, inset, inset, S - 2 * inset, S - 2 * inset, 0, 0, 400, 400);
  b.disabled = true;
  const blob = await new Promise((resolve) => out.toBlob(resolve, 'image/jpeg', 0.86));
  const ok = blob ? await setPhoto(blob) : false;
  if (!blob) toast('Не удалось обработать кадр');
  b.disabled = false;
  if (ok) { closeCrop(); toast('Фото обновлено ✓'); }
});

async function api(path, opts = {}) {
  const method = (opts.method || 'GET').toUpperCase();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = await csrf();
  const res = await fetch(path, { credentials: 'same-origin', ...opts, headers });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  return { res, data };
}

  if (showEmail && email) out.push({ net: 'email', login: email, show: true });
  (p.contacts_extra || []).forEach((x) => {
    const net = x.net === 'custom' ? 'custom' : (x.net || 'custom');
    out.push({ net, label: x.label || '', login: x.login || '', show: x.show !== false });
  });
  return out;
}
function profileBodyFromUser(u) {
  const body = {
    display_name: u.name || '',
    handle: u.nick || '',
    bio: u.about || '',
    show_email: false,
    contacts_extra: [],
  };
  const primary = new Set(['telegram', 'vk', 'site', 'email']);
  const by = Object.fromEntries((u.contacts || []).filter((c) => primary.has(c.net)).map((c) => [c.net, c]));
  if (by.telegram) { body.telegram = by.telegram.login; body.show_telegram = !!by.telegram.show; }
  if (by.vk) { body.vk = by.vk.login; body.show_vk = !!by.vk.show; }
  if (by.site) { body.website = by.site.login; body.show_website = !!by.site.show; }
  if (by.email) body.show_email = !!by.email.show;
  for (const c of u.contacts || []) {
    if (primary.has(c.net) || !String(c.login || '').trim()) continue;
    const row = { login: c.login.trim(), show: !!c.show };
    if (contactSelectNet(c) === 'custom') {
      row.net = 'custom';
      row.label = String(c.label || '').trim().slice(0, 40) || 'Соцсеть';
    } else {
      row.net = c.net;
    }
    body.contacts_extra.push(row);
  }
  return body;
}
async function loadLive() {
  const { res, data } = await api('/api/auth/me');
  if (!res.ok || !data.user) {
    location.replace('/auth?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
    return false;
  }
  const p = data.profile || {};
  D.user = {
    name: p.display_name || data.user.name || '',
    nick: p.handle || '',
    about: p.bio || '',
    avatar: p.avatar_url || '',
    email: data.user.email || '',
    askMode: 'ask',
    contacts: contactsFromProfile(p, data.user.email, p.show_email),
  };
  D.balance = {
    available: Math.round((data.available_kop || data.balance_kop || 0) / 100),
    hold: Math.round((data.held_kop || 0) / 100),
    history: [],
  };
  try {
    const bal = await api('/api/balance');
    if (bal.res.ok) {
      D.balance.available = Math.round((bal.data.available_kop || bal.data.balance_kop || 0) / 100);
      D.balance.hold = Math.round((bal.data.held_kop || 0) / 100);
      D.balance.history = (bal.data.ledger || []).map((e) => ({
        ts: e.created_at ? Date.parse(e.created_at) : Date.now(),
        type: e.kind === 'topup' ? 'in' : e.kind === 'hold' ? 'hold' : 'gen',
        model: e.model_key || '',
        sum: Math.round((e.amount_kop || 0) / 100),
        note: e.kind === 'topup' ? 'Пополнение' : e.kind === 'hold' ? 'Резерв' : 'Генерация',
      }));
    }
  } catch (_) {}
  try {
    const w = await api('/api/works/mine');
    if (w.res.ok) {
      D.works = (w.data.items || []).map((x) => ({
        id: String(x.id),
        title: x.title || x.model_key || 'Работа',
        src: x.thumb_url || x.media_url || '/assets/bg-light.jpg',
        pub: x.status === 'published',
        likes: x.likes || 0,
        exp: x.expires_at || null,   // неопубликованная удалится в это время (24 ч после генерации)
      }));
    }
  } catch (_) {}
  try {
    const th = await api('/api/threads');
    if (th.res.ok) {
      D.threads = (th.data.items || []).map((x) => {
        if (x.kind === 'assistant') {
          x.with = x.with || {};
          x.with.name = x.with.name || '{AI}-шница';
          x.with.grad = x.with.grad || '#FFA235,#F2668B';
          x.with.assistant = true;
        }
        return x;
      });
    }
  } catch (_) { D.threads = D.threads || []; }
  ensureAssistant();
  return true;
}
async function flushPendingReq() {
  let raw;
  try { raw = sessionStorage.getItem('aish-pending-req'); } catch (_) { return null; }
  if (!raw) return null;
  try { sessionStorage.removeItem('aish-pending-req'); } catch (_) {}
  let payload;
  try { payload = JSON.parse(raw); } catch (_) { return null; }
  const kind = payload.kind === 'custom' ? 'order' : (payload.kind || 'prompt');
  const base = payload.msg || payload.text || '';
  const text = base + (payload.contact ? '\n\nВнешний контакт: ' + payload.contact : '');
  const { res, data } = await api('/api/threads', {
    method: 'POST',
    body: JSON.stringify({
      workId: payload.work || payload.workId || null,
      workTitle: payload.workTitle || '',
      workSrc: payload.workSrc || '',
      kind,
      text,
      fmt: payload.fmt || '',
      creator: payload.creator,
      creatorName: payload.creatorName || '',
    }),
  });
  if (!res.ok || !data.threadId) return null;
  const tid = String(data.threadId);
  if (data.thread) {
    const x = data.thread;
    if (!D.threads.some((t) => String(t.id) === tid)) D.threads.unshift(x);
  } else {
    try {
      const th = await api('/api/threads');
      if (th.res.ok) D.threads = th.data.items || D.threads;
    } catch (_) {}
  }
  return tid;
}
async function persistProfile() {
  const { res, data } = await api('/api/settings/profile', { method: 'POST', body: JSON.stringify(profileBodyFromUser(D.user)) });
  if (!res.ok) {
    toast(data.error === 'handle_taken' ? 'Ник уже занят' : data.error === 'bad_handle' ? 'Ник: 3–24 символа, латиница' : 'Не удалось сохранить');
    return false;
  }
  return true;
}
const _saveLocal = saveLocal;
save = () => {
  _saveLocal();
  if (LIVE) persistProfile().catch(() => {});
};

/* ================= старт ================= */
(async function boot() {
  if (!DEMO) {
    LIVE = true;
    const ok = await loadLive();
    if (!ok) return;
    const pendingId = await flushPendingReq().catch(() => null);
    if (pendingId) {
      try { history.replaceState(null, '', '#messages/' + encodeURIComponent(pendingId)); } catch (_) {}
      toast('Чат с креатором открыт');
    }
  }
  render(); fromHash();
  ensureAssistant();
  const S = DEMO;
  if (S === 'assistant' || S === 'assistant-mid') { openAssistant(); }
  if (S === 'manual') { tab = 'settings'; render(); }
  if (S === 'messages' || S === 'thread') { tab = 'messages'; if (S === 'thread') openThread = 't1'; render(); }
  if (S === 'thread-prompt') { tab = 'messages'; openThread = 't2'; render(); }
  if (S === 'thread-order') { tab = 'messages'; openThread = 't3'; render(); }
  if (S === 'balance' || S === 'empty-balance') { tab = 'balance'; render(); }
  if (S === 'empty-messages') { tab = 'messages'; openAssistant(); }
})();
</script>
