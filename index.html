<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>document.documentElement.setAttribute("data-theme","light");</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{AI}-шница — генеративные модели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#C9C3F3}
:root{--ink-ui:#2E186A} /* между #221048 и #4B2BB8, ближе к первому */
a{color:var(--ink-ui)}a:hover{color:#221048}
.page-bg{background-image:url(assets/bg.jpg);background-size:cover;background-position:center}
/* Liquid glass — mid white for panels, dark chips for actions */
.glass{
  background:linear-gradient(165deg, rgba(255,255,255,.62), rgba(245,242,255,.42) 48%, rgba(230,224,250,.34));
  border:1px solid rgba(255,255,255,.78);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(80,50,140,.05),
    0 16px 40px -22px rgba(75,43,184,.28);
  backdrop-filter:blur(26px) saturate(1.45);
  -webkit-backdrop-filter:blur(26px) saturate(1.45);
}
.speech.glass{
  background:linear-gradient(165deg, rgba(255,255,255,.66), rgba(245,242,255,.46));
}
.speech.glass .speech-tail{
  background:linear-gradient(135deg, rgba(255,255,255,.66), rgba(245,242,255,.46));
  border-left:1px solid rgba(255,255,255,.78);
  border-top:1px solid rgba(255,255,255,.78);
}
.speech #speech{color:var(--ink-ui);text-shadow:none}
.prompt-box.glass{
  background:linear-gradient(165deg, rgba(255,255,255,.64), rgba(240,236,255,.4));
}
.prompt-input{color:var(--ink-ui)!important;caret-color:var(--ink-ui)}
.prompt-input::placeholder{color:#8C82B8!important}
/* Buttons inside prompt: light glass, same ink as speech, no drop shadow */
.tool-btn{
  border:1px solid rgba(255,255,255,.55);
  color:var(--ink-ui);
  background:linear-gradient(155deg, rgba(255,255,255,.45), rgba(220,212,250,.28));
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:none;
  text-shadow:none;
}
.tool-btn svg{stroke:currentColor}
.tool-btn:hover{
  background:linear-gradient(155deg, rgba(255,255,255,.58), rgba(230,224,255,.38))!important;
}
.gen-btn{
  background:radial-gradient(90% 130% at 12% 0%, rgba(255,214,110,0.95) 0%, rgba(255,214,110,0) 55%), linear-gradient(110deg, #FFA235 0%, #FF7B2C 42%, #FF8F7E 74%, #F6AACF 100%)!important;
  text-shadow:0 1px 2px rgba(150,50,20,0.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -3px 8px rgba(236,110,160,0.25), 0 10px 24px -10px rgba(240,110,130,0.7)!important;
}
.prompt-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
  width:100%;
}
.btn-label{display:inline}
html[data-theme="dark"] body,#root[data-theme="dark"]{color:#F4EEFF}
html[data-theme="dark"] .page-bg{filter:saturate(.85) brightness(.72)}
html[data-theme="dark"] .glass,
html[data-theme="dark"] .speech.glass,
html[data-theme="dark"] .prompt-box.glass{
  background:linear-gradient(165deg, rgba(255,255,255,.16), rgba(40,28,80,.28))!important;
}
html[data-theme="dark"] .hdr-tag,html[data-theme="dark"] .hdr-btn{color:#D7CCFF!important}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes orbNod{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(4px) scale(1.03,.96)}60%{transform:translateY(-3px) scale(.98,1.02)}}
@keyframes orbCook{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.04,.97)}50%{transform:rotate(0) scale(.97,1.04)}75%{transform:rotate(8deg) scale(1.04,.97)}100%{transform:rotate(0) scale(1)}}
@keyframes orbJump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(6px) scale(1.08,.9)}50%{transform:translateY(-34px) scale(.95,1.06)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0) scale(1,1)}}
@keyframes glowPulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes glowFast{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.orb-idle{animation:orbFloat 5s ease-in-out infinite}
.orb-listen{animation:orbFloat 3.2s ease-in-out infinite}
.orb-type{animation:orbNod .55s ease-in-out infinite}
.orb-cook{animation:orbCook .9s ease-in-out infinite}
.orb-poke,.orb-done{animation:orbJump .8s cubic-bezier(.3,.7,.4,1) 1}
.glow-idle,.glow-listen,.glow-type,.glow-poke,.glow-done,.glow-talk{animation:glowPulse 5s ease-in-out infinite}
.glow-cook{animation:glowFast .9s ease-in-out infinite}
.eye{position:absolute;transition:transform .28s cubic-bezier(.3,.7,.4,1)}
.eye-shape{display:block;width:100%;height:100%;border-radius:999px;background:#FFFFFF;box-shadow:0 0 10px rgba(255,255,255,.6);transform-origin:50% 50%;transition:height .2s ease,margin-top .2s ease}
.eye-shape{transition:transform .09s ease-in,height .2s ease,margin-top .2s ease}
.eye-blink .eye-shape{transform:scaleY(.08)}
.eye-squint .eye-shape{height:34%;margin-top:40%}
.orb-btn{background:none;border:none;padding:0;cursor:pointer;display:block}
.orb-btn:focus-visible{outline:3px solid #6A3DF0;outline-offset:8px;border-radius:50%}
.prompt-input:focus{outline:none}
.prompt-box:focus-within{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    0 0 0 3px rgba(255,255,255,.22),
    0 24px 60px -22px rgba(75,43,184,.4);
}
.hdr-btn:hover{background:rgba(255,255,255,.28);backdrop-filter:blur(12px)}
/* Lower suggestion chips: cleaner lavender glass, no white stroke */
#replies{
  box-sizing:border-box;
  width:100%;
  max-width:740px;
  display:flex;
  flex-wrap:nowrap;
  gap:10px;
  justify-content:stretch;
  align-items:stretch;
}
.reply{
  cursor:pointer;
  font-family:'Onest',sans-serif;
  font-weight:600;
  color:#fff;
  text-shadow:none;
  background:linear-gradient(155deg, rgba(170,158,220,.62), rgba(150,136,205,.48));
  border:none;
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .2s ease, background .25s ease, opacity .45s ease;
  animation:replyIn .4s ease-out both;
  flex:1 1 0;
  min-width:0;
  justify-content:center;
  white-space:nowrap;
}
.reply--free{flex:1.45 1 0}
.reply:hover{
  background:linear-gradient(155deg, rgba(180,168,228,.7), rgba(160,146,212,.55))!important;
  transform:translateY(-2px);
}
.reply:focus-visible{outline:2px solid rgba(106,61,240,.45);outline-offset:2px}
.reply.is-leaving{opacity:0;transform:translateY(6px);pointer-events:none}
.auth-glass.glass{color:#221048}
.auth-glass.glass input{
  background:rgba(255,255,255,.28);
  border:1px solid rgba(255,255,255,.45);
  color:#221048;
  backdrop-filter:blur(12px);
}
@keyframes replyIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes orbTalk{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.025,.975)}}
.orb-talk{animation:orbTalk .32s ease-in-out infinite}
.caret{display:inline-block;width:.09em;height:.9em;margin-left:.06em;vertical-align:-.08em;background:#E8691C;border-radius:2px;animation:caret 1s steps(1) infinite}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .hdr-tag{display:none}
  .speech h1{white-space:normal!important}
  .prompt-box{padding:14px 12px 12px!important}
  .prompt-actions{
    gap:8px;
    flex-wrap:nowrap;
  }
  .prompt-actions .btn-label{display:none!important}
  #attachBtn,
  #modelsBtn,
  .gen-btn{
    width:44px!important;
    min-width:44px!important;
    height:44px!important;
    padding:0!important;
    margin:0!important;
    border-radius:14px!important;
    display:inline-flex!important;
    align-items:center;
    justify-content:center;
    flex:0 0 44px;
    gap:0!important;
  }
  .gen-btn{margin-left:auto!important}
  /* Same horizontal width as .prompt-box (full width of main padding) */
  #replies{
    width:100%;
    max-width:740px;
    gap:5px;
    margin-top:14px;
    min-height:34px;
    padding:0;
  }
  .reply{
    min-height:32px!important;
    padding:0 6px!important;
    font-size:11px!important;
    gap:4px!important;
    flex:1 1 0;
    min-width:0;
  }
  .reply--free{flex:1.55 1 0!important}
  .reply-free{
    font-size:8px!important;
    padding:2px 5px!important;
    flex-shrink:0;
  }
}
@media (prefers-reduced-motion:reduce){.orb-idle,.orb-listen,.orb-type,.orb-cook,.orb-poke,.orb-done,.orb-talk,.caret,.reply,.glow-idle,.glow-listen,.glow-type,.glow-cook,.glow-poke,.glow-done,.eye-open .eye-shape{animation:none}}

.orb-wrap{position:relative;width:var(--S);height:var(--S)}
</style>
</head>
<body>
<div id="root" class="page-bg" style="min-height: 100vh; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Onest', system-ui, sans-serif; color: #221048; background-color: #C9C3F3; display: flex; flex-direction: column">

  <header style="position: relative; z-index: 2; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 20px; padding: 20px 32px">
    <a href="/" aria-label="{AI}-шница — на главную" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
      <img src="assets/orb.png" alt="" style="width: 30px; height: 30px; display: block">
    </a>
    <nav style="margin-left: auto; display: flex; align-items: center; gap: 6px">
      <button type="button" class="hdr-btn" style="height: 44px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; font-family: 'Onest', sans-serif; font-weight: 600; font-size: 14px; color: #3B2380; cursor: pointer">RU</button>
      <button type="button" id="loginBtn" style="height: 40px; margin-left: 6px; padding: 0 20px; border-radius: 14px; border: none; background: #1B0D3A; color: #FFFFFF; font-family: 'Onest', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Войти</button>
    </nav>
  </header>

  <main style="position: relative; z-index: 1; flex: 1 1 auto; width: 100%; max-width: 1100px; margin: 0 auto; box-sizing: border-box; padding: 16px 20px 80px; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center">
      <div class="orb-wrap" id="orbWrap">
        <div id="glow" class="glow-idle" style="position: absolute; inset: -42%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,236,236,0.85), rgba(246,206,236,0.4) 55%, rgba(240,210,245,0) 100%)"></div>
        <button type="button" id="orbBtn" class="orb-btn" aria-label="Пощекотать {AI}-шницу" style="position: relative; width: 100%; height: 100%">
          <div id="orbBody" class="orb-idle" style="position: relative; width: 100%; height: 100%">
            <img src="assets/orb-no-eyes.png" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
            <span class="eye" id="eye1"><span class="eye-shape"></span></span>
            <span class="eye" id="eye2"><span class="eye-shape"></span></span>
          </div>
        </button>
      </div>
      <div style="width: 110px; height: 12px; border-radius: 50%; background: radial-gradient(closest-side, rgba(75,43,184,0.22), rgba(75,43,184,0)); margin: 10px 0 18px"></div>
    </div>

    <div class="speech glass" style="position: relative; margin: 0 0 26px; max-width: calc(100vw - 40px); box-sizing: border-box; padding: 15px 26px 16px; border-radius: 14px">
      <span class="speech-tail" aria-hidden="true" style="position: absolute; left: 50%; top: -8px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg); border-radius: 3px 0 0 0"></span>
      <h1 id="speech" style="position: relative; margin: 0; min-height: 1.3em; text-align: center; font-family: 'Days One', sans-serif; font-weight: 400; font-size: clamp(16px, 1.6vw, 21px); line-height: 1.3; letter-spacing: -0.01em; white-space: nowrap">
        <span aria-hidden="true"><span id="speechText"></span><span class="caret"></span></span>
      </h1>
    </div>
    <p class="sr-only" aria-live="polite" id="speechLive"></p>

    <form id="promptForm" class="prompt-box glass" style="width: 100%; max-width: 740px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 14px 22px; border-radius: 14px">
      <label for="prompt" class="sr-only">Промпт</label>
      <textarea id="prompt" class="prompt-input" rows="2" placeholder="Напишите яишенке свою идею…" style="width: 100%; box-sizing: border-box; border: none; background: transparent; resize: none; font-family: 'Onest', sans-serif; font-size: 18px; line-height: 1.5; padding: 4px 0 0"></textarea>
      <div class="prompt-actions">
        <button type="button" id="attachBtn" class="tool-btn" aria-label="Прикрепить файл" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg>
        </button>
        <input type="file" id="attachFile" accept="image/*" hidden>
        <button type="button" id="modelsBtn" class="tool-btn" aria-label="Все модели" style="height: 44px; padding: 0 16px; border-radius: 14px; font-family: 'Onest', sans-serif; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
          <span class="btn-label">Все модели</span>
        </button>
        <button type="submit" class="gen-btn" aria-label="Сгенерировать" style="margin-left: auto; height: 48px; padding: 0 22px 0 18px; border-radius: 14px; border: none; color: #FFFFFF; font-family: 'Onest', sans-serif; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
          <span class="btn-label">Сгенерировать</span>
        </button>
      </div>
    </form>

    <div id="replies" style="margin-top: 18px; min-height: 44px"></div>
  </main>
</div>

<dialog id="authDialog" style="border: none; border-radius: 14px; padding: 0; background: transparent; max-width: 420px; width: calc(100vw - 32px)">
  <form id="authForm" class="auth-glass glass" method="dialog" style="padding: 28px 24px; border-radius: 14px; font-family: 'Onest', sans-serif">
    <h3 style="margin: 0 0 8px; font-family: 'Days One', sans-serif; font-weight: 400; font-size: 22px">Вход</h3>
    <p style="margin: 0 0 16px; color: #5E4BA8; font-size: 14px">Код на email — основной способ. Пароль — для старых аккаунтов.</p>
    <input type="email" name="email" required placeholder="Email" autocomplete="email" style="width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(106,61,240,0.18); font: inherit">
    <div id="authCodeWrap" hidden>
      <input type="text" name="code" placeholder="Код из письма" inputmode="numeric" autocomplete="one-time-code" style="width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(106,61,240,0.18); font: inherit">
    </div>
    <input type="password" name="password" placeholder="Пароль (если уже есть)" autocomplete="current-password" style="width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(106,61,240,0.18); font: inherit">
    <label style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #5E4BA8; margin-bottom: 14px">
      <input type="checkbox" name="consent" required style="margin-top: 3px">
      <span>Согласен с <a href="/legal/privacy.html" target="_blank" rel="noreferrer">политикой</a> и <a href="/legal/terms.html" target="_blank" rel="noreferrer">условиями</a></span>
    </label>
    <div style="display: flex; gap: 8px">
      <button type="submit" style="height: 44px; padding: 0 18px; border: none; border-radius: 14px; background: #1B0D3A; color: #fff; font: inherit; font-weight: 600; cursor: pointer">Продолжить</button>
      <button type="button" id="authCancel" style="height: 44px; padding: 0 18px; border: none; border-radius: 14px; background: rgba(240,236,255,0.9); color: #3B2380; font: inherit; font-weight: 600; cursor: pointer">Отмена</button>
    </div>
    <p id="authError" hidden style="margin: 12px 0 0; color: #C94A0A; font-size: 14px"></p>
  </form>
</dialog>

<script>
/* Мини-обёртка: даёт классу персонажа setState/props, как в редакторе дизайна */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch); scheduleRender(); }
}

class Component extends DCLogic {
  init() {
    if (this._ready) return;
    this._ready = true;
    this.state = Object.assign({ mode: 'idle', text: '', focused: false, mx: 0, my: 0, say: '', shown: 0, step: 'start' }, this.state || {});
    this.orbRef = { current: null };
    this.timers = {};
    this.later = (name, ms, fn) => { clearTimeout(this.timers[name]); this.timers[name] = setTimeout(fn, ms); };
    this.setMode = (mode) => { if (this.state.mode !== mode) this.setState({ mode: mode }); };
    this.restMode = () => this.state.focused ? 'listen' : 'idle';
    this.speak = (line, step) => {
      if (Array.isArray(line)) line = this.pick(line);
      clearInterval(this.timers.tw);
      const patch = { say: line, shown: 0 };
      if (this.blinkOnce && Math.random() < 0.6) this.blinkOnce();
      if (step) patch.step = step;
      this.setState(patch);
      this.timers.tw = setInterval(() => {
        const n = this.state.shown + 1;
        if (n >= this.state.say.length) { clearInterval(this.timers.tw); this.setState({ shown: this.state.say.length }); }
        else this.setState({ shown: n });
      }, 30);
      this.scheduleIdle();
    };
    this.pick = (arr) => {
      this._last = this._last || {};
      const key = arr[0];
      let i = Math.floor(Math.random() * arr.length);
      if (arr.length > 1 && this._last[key] === i) i = (i + 1) % arr.length;
      this._last[key] = i;
      return arr[i];
    };
    this.P = {
      hello: [
        'Привет! Что приготовим сегодня?',
        'Привет! Я {AI}-шница — горячая, с пылу с жару!',
        'Привет! Я {AI}-шница. Сковородка уже шкворчит!',
        'Хэй! Я {AI}-шница. Что пожарим сегодня?',
        'Привет-привет! Я {AI}-шница, жарю идеи!'
      ],
      idle: [
        'Может, видео, где кот жарит яичницу?',
        'Или музыку для ленивого завтрака?',
        'Я голодная до идей! Подкинь ингредиентов',
        'Сковородка горячая — самое время для шедевра',
        'Приготовим картинку до слюнок?',
        'Желток стынет! Что будем жарить?',
        'Глазунья, болтунья или блокбастер? Выбирай!',
        'Тссс… слышишь, как шкворчат идеи?'
      ],
      listen: ['Слушаю внимательно, вся во внимании!', 'Ушки на макушке! Ну, то есть желток', 'Сковородка разогрета, жду ингредиенты', 'Пиши смелее — я всё съем!'],
      typing: ['Ммм, пахнет вкусно…', 'Ага, записываю…'],
      ready: ['Звучит аппетитно! Жми «Сгенерировать»', 'Вкуснятина! Подаём на стол?', 'О-о-о, это я бы съела! Жмём «Сгенерировать»?', 'Шеф, рецепт готов — пора на огонь!'],
      readyPerfect: ['Идеально! Жарим или добавим специй?', 'Рецепт собран! Посолить ещё или подаём?', 'Пальчики оближешь! Жарим?'],
      cook: ['Жарю… переворачиваю… не подглядывай!', 'Шкворчит! Подбираю лучшую модель…', 'Взбиваю пиксели до пышной пенки…', 'Минутку, добавляю щепотку магии…'],
      done: ['Готово! С пылу с жару. Ещё порцию?', 'Тадам! Подано горяченьким. Повторим?', 'Шедевр на тарелке! Хочешь добавки?'],
      empty: ['Пустая сковородка грустит. Напиши идею!', 'Сначала ингредиенты — потом магия!', 'Эй, без идеи даже яичницу не пожаришь!'],
      again: ['Что жарим теперь?', 'Новая порция идей? Я в деле!', 'Сковородка свободна — что дальше?'],
      pokes: ['Хи-хи, щекотно!', 'Аккуратно, я же глазунья, а не кнопка!', 'Ой! Ещё раз — и я перевернусь', 'Эй, не трогай желток руками!', 'Ладно-ладно, я тут, я горячая!', 'Ещё чуть-чуть — и я стану болтуньей!']
    };
    this.idleLines = this.P.idle;
    this.scheduleIdle = () => this.later('idle', 8000, () => {
      if (this.state.mode !== 'idle' || this.state.text || this.state.step !== 'start') return;
      this.speak(this.P.idle);
    });
    this.append = (piece) => {
      const t = this.state.text.trim();
      const next = t ? t.replace(/[,.\s]+$/, '') + (t.endsWith(':') ? ' ' : ', ') + piece : piece;
      this.setState({ text: next });
    };
    this.focusInput = () => { const el = document.getElementById('prompt'); if (el) el.focus(); };
    const own = { label: 'Своя идея', go: () => { this.speak(['Слушаю! Пиши прямо в поле — я вся внимание', 'Давай свой рецепт, шеф!', 'Твой фирменный рецепт? Пиши!'], 'free'); this.focusInput(); } };
    this.flows = {
      start: [
        { label: 'Seedance', free: true, go: () => { this.setState({ text: 'Видео в Seedance: ' }); this.speak(['Seedance бесплатно — угощаю! Что снимаем?', 'Seedance — бесплатная добавка! Что в кадре?'], 'video'); } },
        { label: 'Видео', go: () => { this.setState({ text: 'Видео: ' }); this.speak(['Видео — обожаю! Про что будет ролик?', 'Кино на завтрак? Беру! Про что снимаем?', 'Мотор! Что у нас в кадре?'], 'video'); } },
        { label: 'Картинку', go: () => { this.setState({ text: 'Картинка: ' }); this.speak(['Картинка! Что подаём на холст?', 'Нарисую так, что захочется съесть!', 'Холст горячий! Что рисуем?'], 'image'); } },
        { label: 'Музыку', go: () => { this.setState({ text: 'Музыка: ' }); this.speak(['Музыка! Какой жанр шкворчит в душе?', 'Бит под шкворчание сковородки? Какой жанр?', 'Включаем! Какой вкус у трека?'], 'music'); } }
      ],
      video: [
        { label: 'Кот-повар жарит яичницу', go: () => { this.append('кот-повар жарит яичницу'); this.speak(['Это же моя родня! Какое настроение?', 'Мяу-шедевр! Какое настроение?'], 'mood'); } },
        { label: 'Неоновый город под дождём', go: () => { this.append('неоновый город под дождём'); this.speak(['Сочно и мокро! Какое настроение?', 'Неон — как желток в ночи! Какое настроение?'], 'mood'); } },
        { label: 'Блинчики летят в космос', go: () => { this.append('блинчики летят в космос'); this.speak(['Космический завтрак! Какое настроение?', 'Блины на орбите — это вкусно! Настроение?'], 'mood'); } },
        own
      ],
      image: [
        { label: 'Глянцевая яичница в облаках', go: () => { this.append('глянцевая яичница в облаках, пастельные тона'); this.speak(['Это же я! Красавица! В каком стиле?', 'Автопортрет? Обожаю! В каком стиле?'], 'style'); } },
        { label: 'Уютная кухня утром', go: () => { this.append('уютная кухня ранним утром, солнце, кофе'); this.speak(['Пахнет кофе и тостами! В каком стиле?', 'Уютно, как тёплый тост! Стиль?'], 'style'); } },
        { label: 'Бургер-небоскрёб', go: () => { this.append('бургер высотой с небоскрёб'); this.speak(['Слюнки потекли! В каком стиле?', 'Сочно! Какой стиль подаём?'], 'style'); } },
        own
      ],
      music: [
        { label: 'Лоу-фай', go: () => { this.append('лоу-фай бит'); this.speak(['Мягко, как омлет! Для чего трек?', 'Расслабон! Для чего трек?'], 'purpose'); } },
        { label: 'Синтвейв', go: () => { this.append('синтвейв'); this.speak(['Ретро с хрустящей корочкой! Для чего?', 'Неоновый вкус! Для чего?'], 'purpose'); } },
        { label: 'Джаз', go: () => { this.append('джаз'); this.speak(['Джаз — как бенедикт: изысканно! Для чего?', 'Саксофон и тосты! Для чего трек?'], 'purpose'); } },
        own
      ],
      mood: [
        { label: 'Уютное', go: () => { this.append('уютное настроение'); this.ready(); } },
        { label: 'Эпичное', go: () => { this.append('эпичное настроение'); this.ready(); } },
        { label: 'Смешное', go: () => { this.append('смешное настроение'); this.ready(); } },
        { label: 'Сочное', go: () => { this.append('яркое, сочное настроение'); this.ready(); } }
      ],
      style: [
        { label: '3D', go: () => { this.append('3D-рендер, глянец'); this.ready(); } },
        { label: 'Акварель', go: () => { this.append('акварель'); this.ready(); } },
        { label: 'Фото', go: () => { this.append('фотореализм'); this.ready(); } },
        { label: 'Аниме', go: () => { this.append('аниме-стиль'); this.ready(); } }
      ],
      purpose: [
        { label: 'Для завтрака', go: () => { this.append('для неспешного завтрака'); this.ready(); } },
        { label: 'Для работы', go: () => { this.append('для фокуса на работе'); this.ready(); } },
        { label: 'Для вечеринки', go: () => { this.append('для вечеринки'); this.ready(); } }
      ],
      ready: [
        { label: 'Сгенерировать', go: () => this.onSubmit() },
        { label: 'Начать заново', go: () => this.reset() }
      ],
      done: [
        { label: 'Ещё порцию', go: () => this.onSubmit() },
        { label: 'Новая идея', go: () => this.reset() }
      ],
      free: []
    };
    this.ready = () => { this.speak(this.P.readyPerfect, 'ready'); this.setMode('listen'); };
    this.reset = () => { this.setState({ text: '' }); this.setMode('idle'); this.speak(this.P.again, 'start'); };
    this.onMove = (e) => {
      const el = this.orbRef.current; if (!el || !el.getBoundingClientRect) return;
      const r = el.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width / 2)) / 420;
      const dy = (e.clientY - (r.top + r.height / 2)) / 320;
      this.setState({ mx: Math.max(-1, Math.min(1, dx)), my: Math.max(-1, Math.min(1, dy)) });
    };
    this.onFocus = () => {
      this.setState({ focused: true });
      if (this.state.mode === 'idle') this.setMode('listen');
      if (!this.state.text.trim() && this.state.step === 'start') this.speak(this.P.listen);
    };
    this.onBlur = () => { this.setState({ focused: false }); this.later('blur', 200, () => { if (this.state.mode === 'listen' || this.state.mode === 'type') this.setMode('idle'); }); };
    this.onType = (e) => {
      const v = e.target.value;
      this.setState({ text: v });
      if (this.state.mode !== 'cook') this.setMode('type');
      this.later('type', 1000, () => {
        if (this.state.mode !== 'type') return;
        this.setMode(this.restMode());
        const t = this.state.text.toLowerCase();
        if (!t.trim()) { this.speak(['Не стесняйся, пиши что угодно — я всеядная!', 'Пустая сковородка… давай что-нибудь закинем!'], 'start'); return; }
        if (this.state.step === 'ready') { this.speak(['Ага, досолила! Жми «Сгенерировать»', 'Учла, добавила в рецепт! Жарим?'], 'ready'); return; }
        if (/видео|ролик|клип|анимац/.test(t)) this.speak(['Видео? Уже шкворчит! Какое настроение?', 'Кино на сковородке! Какое настроение?'], 'mood');
        else if (/музык|трек|песн|бит/.test(t)) this.speak(['Звучит вкусно! Для чего трек?', 'Слышу бит! Для чего трек?'], 'purpose');
        else if (/картин|фото|изображ|арт|постер/.test(t)) this.speak(['Нарисую — пальчики оближешь! В каком стиле?', 'Аппетитно! В каком стиле?'], 'style');
        else this.speak(this.P.ready, 'ready');
      });
    };
    this.goStudio = (extra) => {
      const q = new URLSearchParams(extra || {});
      const prompt = (this.state.text || '').trim();
      if (prompt) q.set('prompt', prompt);
      location.href = '/app?' + q.toString();
    };
    this.onSubmit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (!this.state.text.trim()) { this.setMode('poke'); this.speak(this.P.empty); this.later('poke', 1100, () => this.setMode(this.restMode())); return; }
      this.setMode('cook');
      this.speak(this.P.cook, 'cooking');
      this.later('cook', 1600, () => {
        this.setMode('done');
        this.speak(this.P.done, 'done');
        this.later('done', 700, () => this.goStudio());
      });
    };
    this.onPoke = () => {
      if (this.state.mode === 'cook') return;
      this.setMode('poke');
      const prev = { say: this.state.say, step: this.state.step };
      this.speak(this.P.pokes);
      this.later('poke', 1100, () => this.setMode(this.restMode()));
      this.later('pokeBack', 2600, () => { if (this.state.mode !== 'cook') this.speak(prev.say, prev.step); });
    };
  }
  componentDidMount() {
    this.init();
    this.speak(this.P.hello, 'start');
    const blinkOnce = (cb) => { this.setState({ blink: true }); this.later('blinkUp', 130, () => { this.setState({ blink: false }); if (cb) this.later('blink2', 160, cb); }); };
    const loop = () => this.later('blinkLoop', 2000 + Math.random() * 2600, () => {
      if (Math.random() < 0.3) blinkOnce(() => blinkOnce(loop)); else { blinkOnce(); loop(); }
    });
    this.blinkOnce = blinkOnce;
    this.later('firstBlink', 900, () => blinkOnce(loop));
  }
  componentWillUnmount() { Object.values(this.timers || {}).forEach((t) => { clearTimeout(t); clearInterval(t); }); }
  renderVals() {
    this.init();
    const S = this.props.orbSize ?? 200;
    const st = this.state;
    const typing = st.shown < st.say.length;
    let mode = st.mode;
    if (typing && (mode === 'idle' || mode === 'listen')) mode = 'talk';
    const eyeW = Math.round(S * 0.085), eyeH = Math.round(S * 0.27);
    let ex, ey;
    if (st.mode === 'listen' || st.mode === 'type') {
      const p = Math.min(st.text.length / 70, 1);
      ex = (-0.07 + p * 0.14) * S; ey = 0.1 * S;
    } else if (st.mode === 'cook') { ex = 0; ey = 0.02 * S; }
    else { ex = st.mx * 0.09 * S; ey = st.my * 0.07 * S; }
    const squint = st.mode === 'cook' || st.mode === 'done' || st.mode === 'poke';
    // Keep chips while speech types; hide only during cook / leaving
    const hideChips = st.mode === 'cook';
    const list = hideChips ? [] : (this.flows[st.step] || []);
    const replies = list.map((r, i) => ({ label: r.label, free: !!r.free, pick: r.go, delay: i * 70 }));
    return {
      S: S, mode: mode, text: st.text, say: st.say || ' ', shown: st.say.slice(0, st.shown),
      eyeW: eyeW, eyeH: eyeH, eyeT: Math.round(S * 0.5 - eyeH / 2 - S * 0.02),
      eyeL1: Math.round(S * 0.385 - eyeW / 2), eyeL2: Math.round(S * 0.615 - eyeW / 2),
      ex: Math.round(ex), ey: Math.round(ey),
      eyeClass: squint ? 'eye-squint' : 'eye-open',
      blinkClass: st.blink && !squint ? 'eye-blink' : '',
      replies: replies,
      orbRef: this.orbRef, onMove: this.onMove, onFocus: this.onFocus, onBlur: this.onBlur,
      onType: this.onType, onSubmit: this.onSubmit, onPoke: this.onPoke
    };
  }
}


/* ---------- монтирование без фреймворка ---------- */
const ORB_SIZE = 200; // размер яишенки в px (140–280)
const app = new Component({ orbSize: ORB_SIZE });
const $ = (id) => document.getElementById(id);
const els = {
  root: $('root'), wrap: $('orbWrap'), glow: $('glow'), btn: $('orbBtn'), body: $('orbBody'),
  eye1: $('eye1'), eye2: $('eye2'), text: $('speechText'), h1: $('speech'), live: $('speechLive'),
  input: $('prompt'), form: $('promptForm'), replies: $('replies')
};
let raf = 0, lastRepliesKey = '', lastSay = '';
function scheduleRender() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render() {
  const v = app.renderVals();
  v.orbRef.current = els.btn;
  els.wrap.style.setProperty('--S', v.S + 'px');
  els.glow.className = 'glow-' + v.mode;
  els.body.className = 'orb-' + v.mode;
  [[els.eye1, v.eyeL1], [els.eye2, v.eyeL2]].forEach(([el, left]) => {
    el.className = ('eye ' + v.eyeClass + ' ' + v.blinkClass).trim();
    el.style.cssText = `left:${left}px;top:${v.eyeT}px;width:${v.eyeW}px;height:${v.eyeH}px;transform:translate(${v.ex}px, ${v.ey}px)`;
  });
  els.text.textContent = v.shown;
  els.h1.setAttribute('aria-label', v.say);
  if (v.say !== lastSay) { els.live.textContent = v.say; lastSay = v.say; }
  if (els.input.value !== v.text) els.input.value = v.text;
  const key = app.state.step + '|' + v.replies.map(r => r.label).join('|');
  if (key !== lastRepliesKey) {
    const nextKey = key;
    const nextReplies = v.replies.slice();
    lastRepliesKey = nextKey; // lock so raf doesn't retrigger leave
    const paint = () => {
      els.replies.innerHTML = '';
      nextReplies.forEach((r) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'reply' + (r.free ? ' reply--free' : '');
        b.style.cssText = `min-height:44px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;animation-delay:${r.delay}ms`;
        const label = document.createElement('span');
        label.className = 'reply-label';
        label.textContent = r.label;
        b.appendChild(label);
        if (r.free) {
          const f = document.createElement('span');
          f.className = 'reply-free';
          f.textContent = 'FREE';
          f.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#FFFFFF;background:#7B6BB5;padding:3px 7px;border-radius:999px';
          b.appendChild(f);
        }
        b.addEventListener('click', () => r.pick());
        els.replies.appendChild(b);
      });
    };
    const current = els.replies.querySelectorAll('.reply:not(.is-leaving)');
    if (current.length) {
      current.forEach((el) => el.classList.add('is-leaving'));
      clearTimeout(window.__replyLeaveTimer);
      window.__replyLeaveTimer = setTimeout(paint, nextReplies.length ? 280 : 420);
    } else {
      paint();
    }
  }
}

app.init();
els.root.addEventListener('mousemove', (e) => app.onMove(e));
els.input.addEventListener('input', (e) => app.onType(e));
els.input.addEventListener('focus', () => app.onFocus());
els.input.addEventListener('blur', () => app.onBlur());
els.form.addEventListener('submit', (e) => app.onSubmit(e));
els.btn.addEventListener('click', () => app.onPoke());
render();
app.componentDidMount();

/* --- продукт: тема, вход, студия --- */
async function ensureCsrf() {
  const m = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
  if (m) return decodeURIComponent(m[1]);
  const r = await fetch('/api/csrf', { credentials: 'same-origin' });
  const d = await r.json().catch(() => ({}));
  return d.csrf_token || '';
}
async function api(path, opts = {}) {
  const method = (opts.method || 'GET').toUpperCase();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = await ensureCsrf();
  const res = await fetch(path, { credentials: 'same-origin', ...opts, headers });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}
const loginBtn = document.getElementById('loginBtn');
const authDialog = document.getElementById('authDialog');
const authForm = document.getElementById('authForm');
const authError = document.getElementById('authError');
async function refreshLoginUi() {
  const { data } = await api('/api/auth/me');
  if (data.user) {
    loginBtn.textContent = (data.user.name || data.user.email || 'Кабинет').split('@')[0].slice(0, 16);
    loginBtn.onclick = () => { location.href = '/app'; };
  } else {
    loginBtn.textContent = 'Войти';
    loginBtn.onclick = () => authDialog.showModal();
  }
}
loginBtn.addEventListener('click', () => authDialog.showModal());
document.getElementById('authCancel').addEventListener('click', () => authDialog.close());
document.getElementById('modelsBtn').addEventListener('click', () => {
  const q = new URLSearchParams({ models: '1' });
  const prompt = (app.state.text || '').trim();
  if (prompt) q.set('prompt', prompt);
  location.href = '/app?' + q.toString();
});
document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('attachFile').click());
authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.hidden = true;
  const fd = new FormData(authForm);
  const email = String(fd.get('email') || '');
  const password = String(fd.get('password') || '');
  const code = String(fd.get('code') || '');
  const consent = Boolean(fd.get('consent'));
  if (code) {
    const { res } = await api('/api/auth/email-code/verify', { method: 'POST', body: JSON.stringify({ email, code }) });
    if (!res.ok) { authError.hidden = false; authError.textContent = 'Неверный или просроченный код'; return; }
    authDialog.close();
    await refreshLoginUi();
    return;
  }
  if (!password) {
    const { res, data } = await api('/api/auth/email-code/request', { method: 'POST', body: JSON.stringify({ email, consent_152: consent }) });
    if (!res.ok) { authError.hidden = false; authError.textContent = data.error === 'consent_required' ? 'Нужно согласие' : 'Не удалось отправить код'; return; }
    document.getElementById('authCodeWrap').hidden = false;
    authError.hidden = false;
    authError.textContent = data.dev_code ? ('Код (dev): ' + data.dev_code) : 'Код отправлен на email';
    return;
  }
  const { res, data } = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
  if (!res.ok) { authError.hidden = false; authError.textContent = 'Неверный email или пароль'; return; }
  authDialog.close();
  await refreshLoginUi();
});
ensureCsrf().then(refreshLoginUi);
if (location.search.includes('login=1')) authDialog.showModal();
