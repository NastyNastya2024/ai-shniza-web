<html lang="ru">

  <link rel="stylesheet" href="styles.css?v=55">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <main class="inner-page">
    <div class="container">
      <h1 class="inner-title" data-i18n="prices.title">Цены</h1>
      <div class="price-grid">
        <article class="price-card">
          <h2 data-i18n="prices.free.name">Старт</h2>
          <p class="price-sum">0 ₽</p>
          <p data-i18n="prices.free.desc">Попробуйте генерацию без оплаты</p>
          <a class="price-cta" href="generate.html" data-i18n="prices.cta">Выбрать</a>

        <article class="price-card price-card--featured">

        <article class="price-card">
          <h2 data-i18n="prices.studio.name">Студия</h2>
          <p class="price-sum">4 900 ₽</p>
          <p data-i18n="prices.studio.desc">Для команд и большого объёма</p>
          <a class="price-cta" href="generate.html" data-i18n="prices.cta">Выбрать</a>
